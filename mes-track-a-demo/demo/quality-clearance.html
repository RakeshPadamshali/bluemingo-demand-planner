<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clearance — Bluemingo MES</title>
<link href="assets/vendor/roboto/roboto.css" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="assets/mes-styles.css">
<style>
  /* Clearance — screen-specific styles (re-homed from the QA Quality module under the demo shell) */
  :root{ --fs-xs:11px; --fs-sm:12px; --fs-base:14px; --fs-md:16px; --fs-xl:24px; --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:20px; }

  /* status badge colours (base .badge comes from mes-styles.css) */
  .b-pass{background:rgba(76,175,80,.12);color:#388e3c;}
  .b-fail{background:rgba(244,67,54,.12);color:#d32f2f;}
  .b-pend{background:rgba(255,152,0,.12);color:#ef6c00;}
  .b-hold{background:rgba(244,67,54,.12);color:#c62828;}
  .b-clr{background:rgba(103,58,183,.12);color:#673ab7;}
  .b-info{background:rgba(33,150,243,.12);color:#1976d2;}
  .b-warn{background:rgba(245,124,0,.14);color:#ef6c00;}
  .b-na{background:#eee;color:#888;}

  .card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);display:flex;flex-direction:column;min-height:0;overflow:hidden;}

  /* ---- clearance-specific ---- */
  .stat-strip{display:flex;flex-wrap:wrap;gap:var(--sp2);margin-bottom:var(--sp3);}
  .stat-chip{display:inline-flex;align-items:center;gap:var(--sp2);background:#fff;border:1px solid var(--color-border);border-radius:999px;padding:5px 14px;font-size:var(--fs-sm);color:var(--color-text-secondary);}
  .stat-chip .n{font-size:var(--fs-md);font-weight:700;font-variant-numeric:tabular-nums;color:var(--color-text-primary);}
  .stat-chip .dt{width:8px;height:8px;border-radius:50%;}
  .stat-chip.c-cleared .dt{background:var(--color-success);} .stat-chip.c-cleared .n{color:#388e3c;}
  .stat-chip.c-pending .dt{background:var(--color-warning);} .stat-chip.c-pending .n{color:#ef6c00;}
  .stat-chip.c-hold .dt{background:var(--color-danger);} .stat-chip.c-hold .n{color:#c62828;}
  .stat-chip.c-final .dt{background:var(--color-primary);} .stat-chip.c-final .n{color:var(--color-primary-dark);}

  .matrix-head{padding:var(--sp3) var(--sp4);border-bottom:1px solid var(--color-border-light);display:flex;justify-content:space-between;align-items:center;gap:var(--sp3);flex-wrap:wrap;}
  .clr-wrap{display:grid;grid-template-columns:300px 1fr;gap:var(--sp3);height:calc(100vh - 168px);min-height:420px;}
  .clr-orders,.clr-stages{min-height:0;}
  .ord-head{padding:var(--sp3) var(--sp4);border-bottom:1px solid var(--color-border-light);font-weight:600;font-size:var(--fs-sm);text-transform:uppercase;letter-spacing:.4px;color:var(--color-text-muted);}
  .ord-list{overflow:auto;flex:1;min-height:0;}
  .ord-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:1px solid #f3f3f3;cursor:pointer;}
  .ord-item:hover{background:#f7fafc;}
  .ord-item.sel{background:rgba(37,169,224,.10);box-shadow:inset 3px 0 0 var(--color-primary);}
  .ord-item .oi-fpo{font-weight:600;font-size:13.5px;color:var(--color-text-primary);}
  .ord-item .oi-sub{font-size:var(--fs-xs);color:var(--color-text-muted);margin-top:2px;}
  .ord-meta{display:flex;flex-wrap:wrap;gap:6px;padding:var(--sp3) var(--sp4);border-bottom:1px solid var(--color-border-light);}
  .om-chip{font-size:var(--fs-xs);color:var(--color-text-secondary);background:var(--color-bg-alt);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:3px 8px;}
  .om-chip b{color:var(--color-text-primary);}
  .oi-op{font-size:10px;color:var(--color-text-hint);font-weight:400;margin-left:6px;text-transform:none;letter-spacing:0;}
  .matrix-head .mh-title{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.4px;color:var(--color-text-muted);font-weight:600;}
  .matrix-head .legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .matrix-head .legend .badge{cursor:default;}
  .tbl-scroll{flex:1;min-height:0;overflow:auto;}
  table.matrix{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-sm);}
  table.matrix thead th{position:sticky;top:0;z-index:3;background:#f0f4f7;text-align:center;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.4px;color:var(--color-text-muted);font-weight:700;padding:9px 12px;white-space:nowrap;border-bottom:1px solid var(--color-border);}
  table.matrix thead th.lcol{text-align:left;}
  table.matrix tbody td{padding:8px 12px;border-bottom:1px solid #f3f3f3;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums;}
  table.matrix tbody tr:hover td{background:#eef7fc;}
  table.matrix td.lcol{text-align:left;}
  table.matrix td.t-heat{font-weight:600;}
  table.matrix .muted{color:var(--color-text-muted);}
  /* freeze the stage column */
  .col-sticky{position:sticky;background:#fff;z-index:2;}
  table.matrix thead th.col-sticky{z-index:4;background:#f0f4f7;}
  .col-1{left:0;min-width:150px;}
  table.matrix tbody tr:hover .col-sticky{background:#eef7fc;}

  .cell-clr{cursor:pointer;border-radius:var(--radius-sm);transition:box-shadow .12s;}
  .cell-clr.clickable:hover{box-shadow:inset 0 0 0 2px rgba(var(--color-primary-rgb),.5);}
  .cell-clr.clickable{position:relative;}
  .cell-clr.clickable::after{content:"\f044";font-family:"Font Awesome 6 Free";font-weight:900;font-size:9px;color:var(--color-primary);position:absolute;top:3px;right:4px;opacity:0;transition:opacity .12s;}
  .cell-clr.clickable:hover::after{opacity:1;}

  /* clearance modal context box */
  .ctx{background:var(--color-bg-alt);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--sp3) var(--sp4);}
  .ctx .row{display:flex;gap:var(--sp4);flex-wrap:wrap;margin-bottom:6px;font-size:var(--fs-sm);}
  .ctx .row:last-child{margin-bottom:0;}
  .ctx .k{color:var(--color-text-muted);} .ctx .v{font-weight:600;font-variant-numeric:tabular-nums;}

  @media (max-width:820px){ .clr-wrap{grid-template-columns:1fr;height:auto;} }
</style>
</head>
<body>
<script src="assets/mes-data.js"></script>
<script src="assets/mes-shell.js"></script>
<script src="assets/mes-components.js"></script>
<script>
const D = MES_DATA;
const { body } = MESShell.mount({ active: 'q-clearance', title: 'Clearance', crumb: ['Quality', 'Clearance'] });

body.innerHTML = `
  <div class="stat-strip" id="strip"></div>
  <div class="clr-wrap">
    <div class="card clr-orders">
      <div class="ord-head">Work Orders</div>
      <div class="ord-list" id="ordList"></div>
    </div>
    <div class="card clr-stages">
      <div class="matrix-head">
        <div class="mh-title" id="ordTitle">Clearance</div>
        <div class="legend">
          <span class="badge b-pass">Cleared</span>
          <span class="badge b-info">Conditional</span>
          <span class="badge b-pend">Pending</span>
          <span class="badge b-hold">Held</span>
          <span class="badge b-fail">Rejected</span>
          <span class="badge b-na">N/A</span>
        </div>
      </div>
      <div class="ord-meta" id="ordMeta"></div>
      <div class="tbl-scroll">
        <table class="matrix">
          <thead>
            <tr>
              <th class="lcol col-sticky col-1">Stage</th>
              <th>Chemistry</th>
              <th>Mechanical</th>
              <th>Physical</th>
              <th>UT</th>
              <th>Stage clearance</th>
            </tr>
          </thead>
          <tbody id="mbody"></tbody>
        </table>
      </div>
    </div>
  </div>`;

const DIMS = ['chemistry', 'mechanical', 'physical', 'ut'];
const DIM_LABEL = { chemistry: 'Chemistry', mechanical: 'Mechanical', physical: 'Physical', ut: 'UT', final: 'Final' };
const BADGE = { CLEARED: 'b-pass', HELD: 'b-hold', PENDING: 'b-pend', REJECTED: 'b-fail', 'N/A': 'b-na', CONDITIONAL: 'b-info', READY: 'b-info' };
/* CONDITIONAL (acceptance under deviation) counts as a cleared gate for release; HELD / REJECTED / PENDING do not. */
const CLEARED_STATES = ['CLEARED', 'CONDITIONAL'];

/* Each work order flows through steel stages (cast slab -> hot rolled -> finished); every stage carries per-dimension
   quality gates (chemistry / mechanical / physical / UT). The H2601 order carries a coil cleared under deviation. */
const ORDERS = [
  { fpo: 'FPO-2026-0341', so: 'SO-2026-04471', customer: 'Apex Heavy Engineering', grade: 'IS 2062 E250', heat: 'H2601', uid: 'ISWHSM2C2601001', tdc: 'TDC-E250', qty: '25.9 MT', stages: [
    { stage: 'Cast Slab',       op: 'CCM1',      chemistry: 'CLEARED', mechanical: 'N/A',         physical: 'CLEARED', ut: 'N/A' },
    { stage: 'Hot Rolled Coil', op: 'HSM-2',     chemistry: 'N/A',     mechanical: 'CONDITIONAL', physical: 'CLEARED', ut: 'N/A' },
    { stage: 'Finished Coil',   op: 'Finishing', chemistry: 'N/A',     mechanical: 'PENDING',     physical: 'PENDING', ut: 'N/A' }] },
  { fpo: 'FPO-2026-0344', so: 'SO-2026-04478', customer: 'Vulcan Forge', grade: 'IS 2062 E250', heat: 'H2602', uid: 'ISWHSM2C2602001', tdc: 'TDC-E250', qty: '22.4 MT', stages: [
    { stage: 'Cast Slab',       op: 'CCM1',      chemistry: 'CLEARED', mechanical: 'N/A',     physical: 'CLEARED', ut: 'N/A' },
    { stage: 'Hot Rolled Coil', op: 'HSM-2',     chemistry: 'N/A',     mechanical: 'CLEARED', physical: 'CLEARED', ut: 'PENDING' },
    { stage: 'Finished Coil',   op: 'Finishing', chemistry: 'N/A',     mechanical: 'PENDING', physical: 'PENDING', ut: 'N/A' }] },
  { fpo: 'FPO-2026-0339', so: 'SO-2026-04465', customer: 'Meridian SAW', grade: 'SAILMA 350', heat: 'H2603', uid: 'ISWCC2H2603S001', tdc: 'TDC-SLM350', qty: '48.6 MT', stages: [
    { stage: 'Cast Slab',        op: 'CCM2',      chemistry: 'REJECTED', mechanical: 'N/A',     physical: 'CLEARED', ut: 'N/A' },
    { stage: 'Hot Rolled Plate', op: 'HSM-2',     chemistry: 'N/A',      mechanical: 'CLEARED', physical: 'CLEARED', ut: 'CONDITIONAL' },
    { stage: 'Finished Plate',   op: 'Finishing', chemistry: 'N/A',      mechanical: 'PENDING', physical: 'PENDING', ut: 'N/A' }] },
  { fpo: 'FPO-2026-0345', so: 'SO-2026-04482', customer: 'Meridian Pipes', grade: 'API 5L X60', heat: 'H2605', uid: 'ISWHSM2C2605001', tdc: 'TDC-X60', qty: '20.5 MT', stages: [
    { stage: 'Cast Slab',       op: 'CCM2',      chemistry: 'CLEARED', mechanical: 'N/A',      physical: 'CLEARED', ut: 'N/A' },
    { stage: 'Hot Rolled Coil', op: 'HSM-2',     chemistry: 'N/A',     mechanical: 'REJECTED', physical: 'CLEARED', ut: 'CLEARED' },
    { stage: 'Finished Coil',   op: 'Finishing', chemistry: 'N/A',     mechanical: 'PENDING',  physical: 'PENDING', ut: 'N/A' }] },
  { fpo: 'FPO-2026-0347', so: 'SO-2026-04486', customer: 'Summit Projects', grade: 'IS 2062 E250', heat: 'H2606', uid: 'ISWHSM2C2606001', tdc: 'TDC-E250', qty: '24.8 MT', stages: [
    { stage: 'Cast Slab',       op: 'CCM1',      chemistry: 'CLEARED', mechanical: 'N/A',     physical: 'CLEARED', ut: 'N/A' },
    { stage: 'Hot Rolled Coil', op: 'HSM-2',     chemistry: 'N/A',     mechanical: 'CLEARED', physical: 'CLEARED', ut: 'CLEARED' },
    { stage: 'Finished Coil',   op: 'Finishing', chemistry: 'N/A',     mechanical: 'CLEARED', physical: 'CLEARED', ut: 'N/A' }] }
];
let curOrder = 0;

// a stage clears when all its applicable (non-N/A) gates clear; an order clears when all stages clear
function stageState(st) {
  const ds = DIMS.filter(d => st[d] !== 'N/A'); if (!ds.length) return 'N/A';
  if (ds.some(d => st[d] === 'REJECTED')) return 'REJECTED';
  if (ds.some(d => st[d] === 'HELD')) return 'HELD';
  if (ds.every(d => CLEARED_STATES.includes(st[d]))) return st.released ? 'CLEARED' : 'READY';
  return 'PENDING';
}
function orderState(o) {
  const ss = o.stages.map(stageState).filter(s => s !== 'N/A');
  if (ss.some(s => s === 'REJECTED')) return 'REJECTED';
  if (ss.some(s => s === 'HELD')) return 'HELD';
  if (ss.length && ss.every(s => s === 'CLEARED')) return 'CLEARED';
  return 'PENDING';
}
function bdg(s) { return `<span class="badge ${BADGE[s] || 'b-pend'}">${s === 'N/A' ? 'N/A' : s}</span>`; }
function isActionable(s) { return s === 'PENDING' || s === 'REJECTED'; }

function renderStrip() {
  let cleared = 0, pending = 0, hold = 0, ordRel = 0;
  ORDERS.forEach(o => {
    o.stages.forEach(st => DIMS.forEach(d => { const s = st[d]; if (CLEARED_STATES.includes(s)) cleared++; else if (s === 'PENDING') pending++; else if (s === 'HELD' || s === 'REJECTED') hold++; }));
    if (orderState(o) === 'CLEARED') ordRel++;
  });
  document.getElementById('strip').innerHTML = `
    <span class="stat-chip c-cleared"><span class="dt"></span><span class="n">${cleared}</span> Gates cleared</span>
    <span class="stat-chip c-pending"><span class="dt"></span><span class="n">${pending}</span> Pending</span>
    <span class="stat-chip c-hold"><span class="dt"></span><span class="n">${hold}</span> Held / rejected</span>
    <span class="stat-chip c-final"><span class="dt"></span><span class="n">${ordRel}</span> Orders released</span>`;
}

function renderOrders() {
  document.getElementById('ordList').innerHTML = ORDERS.map((o, i) => {
    const st = orderState(o);
    return `<div class="ord-item ${i === curOrder ? 'sel' : ''}" onclick="selectOrder(${i})">
      <div class="oi-tx"><div class="oi-fpo">${o.fpo}</div><div class="oi-sub">${o.customer} · ${o.grade} · ${o.heat}</div></div>
      <span class="badge ${BADGE[st] || 'b-pend'}">${st}</span></div>`;
  }).join('');
}
function selectOrder(i) { curOrder = i; renderOrders(); renderStages(); }
function renderStages() {
  const o = ORDERS[curOrder];
  document.getElementById('ordTitle').textContent = o.fpo + ' — ' + o.customer;
  document.getElementById('ordMeta').innerHTML = [['SO', o.so], ['Grade', o.grade], ['Heat', o.heat], ['Batch', o.uid], ['TDC', o.tdc], ['Qty', o.qty]].map(p => `<span class="om-chip">${p[0]} <b>${p[1]}</b></span>`).join('');
  document.getElementById('mbody').innerHTML = o.stages.map((st, si) => {
    const cells = DIMS.map(d => {
      const s = st[d];
      if (s === 'N/A') return `<td class="cell-clr">${bdg('N/A')}</td>`;
      const act = isActionable(s);
      return `<td class="cell-clr ${act ? 'clickable' : ''}" ${act ? `onclick="openModal(${si},'${d}')" title="Record clearance"` : ''}>${bdg(s)}</td>`;
    }).join('');
    const ss = stageState(st), ready = ss === 'READY';
    const stageCell = `<td class="cell-clr ${ready ? 'clickable' : ''}" ${ready ? `onclick="releaseStage(${si})" title="Clear stage — all gates passed"` : ''}>${bdg(ss)}</td>`;
    return `<tr><td class="lcol col-sticky col-1 t-heat">${st.stage} <span class="oi-op">${st.op}</span></td>${cells}${stageCell}</tr>`;
  }).join('');
}

/* ---- record-clearance dialog (MESC modal). Choosing CONDITIONAL reveals the acceptance-under-deviation
   approval chain: Shift Manager -> QC Head. ---- */
function field(labelText, control) { return h('div', { class: 'field' }, [h('label', {}, [labelText]), control]); }

function openModal(si, dim) {
  const o = ORDERS[curOrder], st = o.stages[si];
  const ctxBox = h('div', { class: 'ctx', html: `
    <div class="row"><span><span class="k">Order:</span> <span class="v">${o.fpo}</span></span><span><span class="k">Stage:</span> <span class="v">${st.stage}</span></span></div>
    <div class="row"><span><span class="k">Gate:</span> <span class="v">${DIM_LABEL[dim]}</span></span><span><span class="k">Current:</span> ${bdg(st[dim])}</span></div>
    <div class="row"><span class="k">Heat:</span> <span class="v">${o.heat}</span> <span class="k">Grade:</span> <span class="v">${o.grade}</span> <span class="k">TDC:</span> <span class="v">${o.tdc}</span></div>` });

  const resultSel = h('select', {}, [
    h('option', { value: 'CLEARED' }, ['CLEARED']),
    h('option', { value: 'CONDITIONAL' }, ['CONDITIONAL']),
    h('option', { value: 'HELD' }, ['HELD']),
    h('option', { value: 'REJECTED' }, ['REJECTED'])
  ]);
  resultSel.value = st[dim] === 'REJECTED' ? 'CONDITIONAL' : 'CLEARED';

  const byInp = h('input', { value: 'QA — Central MS Lab' });
  const remTa = h('textarea', { placeholder: 'Basis of clearance, deviation / concession reference, customer note…', style: 'resize:vertical;min-height:60px' });
  const devRef = h('input', { placeholder: 'Deviation / concession ref (e.g. AUD-2026-0142)' });

  const audPanel = h('div', { class: 'field' }, [
    h('div', { class: 'alert alert-info' }, [MESC.icon('fa-circle-info'),
      h('div', {}, [
        h('span', { class: 'a-title' }, ['Acceptance under deviation — ']),
        h('span', {}, ['material is released conditionally and stays flagged until sign-off.']),
        h('div', { class: 'flow mt-8' }, [
          h('span', { class: 'step done' }, [h('span', { class: 's-dot' }), 'Shift Manager']),
          h('span', { class: 'arrow' }, ['→']),
          h('span', { class: 'step current' }, [h('span', { class: 's-dot' }), 'QC Head'])
        ])
      ])
    ]),
    h('label', { style: 'display:block;margin:8px 0 4px;font-weight:500;color:var(--color-text-secondary);font-size:12px' }, ['Deviation / concession ref']),
    devRef
  ]);
  const syncAud = () => audPanel.classList.toggle('hidden', resultSel.value !== 'CONDITIONAL');
  resultSel.addEventListener('change', syncAud);

  const modal = MESC.modal({
    title: 'Record clearance', icon: 'fa-circle-check',
    body: [ctxBox, field('Result', resultSel), field('Cleared by', byInp), field('Remarks', remTa), audPanel],
    footer: [
      h('button', { class: 'btn btn-ghost btn-sm', onclick: () => modal.close() }, ['Cancel']),
      h('button', { class: 'btn btn-primary btn-sm', onclick: () => saveClearance(si, dim, resultSel.value, modal) }, [MESC.icon('fa-floppy-disk'), 'Save'])
    ]
  });
  syncAud();
}
function saveClearance(si, dim, val, modal) {
  const o = ORDERS[curOrder];
  o.stages[si][dim] = val;
  modal.close();
  renderStages(); renderOrders(); renderStrip();
  const g = DIM_LABEL[dim];
  if (val === 'CONDITIONAL') MESShell.toast(o.heat + ' · ' + g + ' cleared under deviation — pending QC Head approval', 'warning');
  else if (val === 'CLEARED') MESShell.toast(o.heat + ' · ' + g + ' gate cleared', 'success');
  else if (val === 'HELD') MESShell.toast(o.heat + ' · ' + g + ' held — routed to disposition', 'warning');
  else MESShell.toast(o.heat + ' · ' + g + ' rejected', 'danger');
}
function releaseStage(si) {
  const o = ORDERS[curOrder], st = o.stages[si];
  st.released = true;
  renderStages(); renderOrders(); renderStrip();
  MESShell.toast(o.fpo + ' · ' + st.stage + ' released to next stage', 'success');
}

renderStrip(); renderOrders(); renderStages();
</script>
</body>
</html>
