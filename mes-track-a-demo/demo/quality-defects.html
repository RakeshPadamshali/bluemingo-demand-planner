<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Defects — Bluemingo MES</title>
<link href="assets/vendor/roboto/roboto.css" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="assets/mes-styles.css">
<style>
  /* Defects — screen-specific styles (re-homed from the QA Quality module under the demo shell) */
  .b-pass{background:rgba(76,175,80,.12);color:#388e3c;} .b-fail{background:rgba(244,67,54,.12);color:#d32f2f;}
  .b-pend{background:rgba(255,152,0,.12);color:#ef6c00;} .b-hold{background:rgba(244,67,54,.12);color:#c62828;}
  .b-clr{background:rgba(103,58,183,.12);color:#673ab7;} .b-info{background:rgba(33,150,243,.12);color:#1976d2;}
  .b-warn{background:rgba(245,124,0,.14);color:#ef6c00;}
  .b-crit{background:rgba(211,47,47,.12);color:#d32f2f;} .b-maj{background:rgba(245,124,0,.14);color:#ef6c00;} .b-min{background:rgba(251,192,45,.18);color:#a07400;}
  .b-purple{background:rgba(103,58,183,.12);color:#673ab7;} .b-slate{background:rgba(96,125,139,.14);color:#455a64;}

  .dm-wrap{display:grid;grid-template-columns:300px 1fr;gap:12px;height:calc(100vh - 152px);min-height:440px;}
  .card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .lhead{padding:12px;border-bottom:1px solid var(--color-border-light);}
  .lhead .lh-title{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--color-text-muted);font-weight:600;margin-bottom:6px;}
  .lsearch{position:relative;}
  .lsearch i{position:absolute;left:10px;top:9px;color:var(--color-text-hint);font-size:11px;}
  .lsearch input{width:100%;padding:7px 10px 7px 28px;border:1px solid #ddd;border-radius:var(--radius-sm);font-size:12px;font-family:inherit;}
  .lsearch input:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(var(--color-primary-rgb),.15);}
  .litems{overflow-y:auto;flex:1;}
  .litem{padding:9px 12px;border-bottom:1px solid #f3f3f3;cursor:pointer;border-left:3px solid transparent;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .litem:hover{background:#eef7fc;} .litem.sel{background:var(--color-primary-light);border-left-color:var(--color-primary);}
  .litem .lh{font-weight:600;font-size:12px;font-variant-numeric:tabular-nums;}
  .litem .lg{font-size:11px;color:var(--color-text-muted);}
  .cbadge{min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:rgba(211,47,47,.12);color:#d32f2f;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
  .detail{min-width:0;}
  .dhead{padding:12px 16px;border-bottom:1px solid var(--color-border-light);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .dh-title{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chips .chip{font-size:12px;color:var(--color-text-secondary);background:var(--color-bg-alt);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:3px 8px;}
  .chips .chip b{color:var(--color-text-primary);font-weight:600;margin-left:3px;}
  .dbody{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px;}
  .sec-title{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--color-text-muted);font-weight:600;margin-bottom:8px;}
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;}
  .fld label{display:block;font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-bottom:4px;}
  .fld select,.fld input{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:var(--radius-sm);font-size:12px;font-family:inherit;}
  .fld select:focus,.fld input:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(var(--color-primary-rgb),.15);}
  .fld.full{grid-column:1/-1;}

  /* ---- defect map ---- */
  .map-card{background:var(--color-bg-alt);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:16px;}
  .map-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .map-meta{font-size:12px;color:var(--color-text-muted);}
  .map-meta b{color:var(--color-text-primary);}
  .loc-tag{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--color-primary-dark);background:var(--color-primary-light);border:1px solid #b3e5fc;border-radius:var(--radius-sm);padding:2px 8px;margin-left:6px;}
  .face-seg{display:inline-flex;border:1px solid var(--color-border);border-radius:var(--radius-sm);overflow:hidden;}
  .face-seg button{padding:6px 14px;border:none;background:#fff;font:500 12px 'Roboto';color:var(--color-text-secondary);border-right:1px solid var(--color-border);cursor:pointer;}
  .face-seg button:last-child{border-right:none;}
  .face-seg button:hover{background:var(--color-bg-alt);}
  .face-seg button.on{background:var(--color-primary);color:#fff;}
  .svg-wrap{position:relative;width:100%;background:#fff;border:1px solid var(--color-border-light);border-radius:var(--radius-sm);overflow:hidden;}
  .svg-wrap svg{display:block;width:100%;height:auto;}
  .dmark{cursor:pointer;transition:r .1s,stroke-width .1s;}
  .dmark:hover{stroke:#222;stroke-width:2;}
  .dmark.active{stroke:#222;stroke-width:2.5;}
  .tip{position:absolute;pointer-events:none;background:#1a1a2e;color:#fff;font-size:11px;line-height:1.5;padding:6px 9px;border-radius:var(--radius-sm);box-shadow:0 4px 14px rgba(0,0,0,.3);transform:translate(-50%,-115%);white-space:nowrap;z-index:5;opacity:0;transition:opacity .1s;}
  .tip.show{opacity:1;}
  .tip b{display:block;font-size:12px;}
  .tip .ts{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:12px;color:var(--color-text-secondary);}
  .legend .lg-item{display:inline-flex;align-items:center;gap:6px;}
  .legend .swatch{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.15);}

  /* ---- defect table ---- */
  .dtable{width:100%;border-collapse:collapse;font-size:12px;border:1px solid var(--color-border-light);border-radius:var(--radius-sm);overflow:hidden;}
  .dtable th{background:#f0f4f7;text-align:left;font-size:10px;text-transform:uppercase;color:var(--color-text-muted);font-weight:600;padding:8px 10px;}
  .dtable td{padding:8px 10px;border-top:1px solid #f3f3f3;vertical-align:middle;}
  .dtable tr.drow{cursor:pointer;} .dtable tr.drow:hover td{background:#eef7fc;} .dtable tr.drow.active td{background:var(--color-primary-light);}
  .dtable .dseq{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;color:#fff;font-size:10px;font-weight:700;}
  .dtable .loc{font-variant-numeric:tabular-nums;color:var(--color-text-secondary);}
  .icon-btn{background:none;border:none;color:#aaa;font-size:13px;padding:4px 6px;border-radius:var(--radius-sm);cursor:pointer;}
  .icon-btn:hover{color:var(--color-danger);background:#ffebee;}
  .empty{padding:20px;text-align:center;color:var(--color-text-hint);font-size:12px;font-style:italic;}

  /* ---- add-defect / disposition form (rendered inside MESC.modal) ---- */
  .dm-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .dm-form .hint{font-size:11px;color:var(--color-text-hint);margin-top:4px;}

  /* ---- defect image review — pure-CSS capture placeholders (no external assets) ---- */
  .gal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
  .dm-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
  .dm-shot{border:1px solid var(--color-border);border-radius:var(--radius-md);overflow:hidden;background:#fff;box-shadow:var(--shadow-sm);}
  .shot-img{position:relative;height:128px;overflow:hidden;color:#5b6b75;
    background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(0,0,0,.07)),
      repeating-linear-gradient(90deg,#c3ccd2 0,#c3ccd2 2px,#b3bdc4 2px,#b3bdc4 4px);}
  .shot-img .grade-sheen{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);}
  .shot-img .shot-scan{position:absolute;left:0;right:0;top:38%;height:2px;background:rgba(37,169,224,.75);box-shadow:0 0 9px rgba(37,169,224,.85);}
  .shot-mark{position:absolute;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--color-danger);box-shadow:0 0 0 3px rgba(0,0,0,.12);}
  .shot-mark::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:1px dashed rgba(0,0,0,.4);}
  .shot-tag{position:absolute;top:6px;left:6px;background:rgba(26,26,46,.82);color:#fff;font-size:9.5px;font-weight:600;letter-spacing:.3px;padding:2px 7px;border-radius:10px;}
  .shot-zoom{position:absolute;bottom:6px;right:6px;color:#fff;background:rgba(26,26,46,.7);width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;}
  .shot-cap{padding:8px 10px;font-size:11px;color:var(--color-text-secondary);display:flex;flex-direction:column;gap:2px;}
  .shot-cap b{color:var(--color-text-primary);font-size:12px;font-weight:600;}
  .shot-cap span{color:var(--color-text-hint);font-variant-numeric:tabular-nums;}

  @media (max-width:820px){ .dm-wrap{grid-template-columns:1fr;height:auto;} }
</style>
</head>
<body>
<script src="assets/mes-data.js"></script>
<script src="assets/mes-shell.js"></script>
<script src="assets/mes-components.js"></script>
<script>
const D = MES_DATA;
const { body } = MESShell.mount({ active: 'q-defects', title: 'Defects', crumb: ['Quality', 'Defects'] });

body.innerHTML = `
  <div class="dm-wrap">
    <div class="card">
      <div class="lhead">
        <div class="lh-title">Slabs &amp; coils with defects — ${D.plant.shift} shift</div>
        <div class="lsearch"><i class="fa-solid fa-magnifying-glass"></i><input id="search" placeholder="UID / heat / grade…"></div>
      </div>
      <div class="litems" id="list"></div>
    </div>
    <div class="card detail" id="detail"></div>
  </div>`;

/* ============ catalogue / enums ============ */
const DEFECT_CATALOG=['Edge crack','Sliver','Scale patch','Rolled-in scale','Roll mark','Inclusion','Longitudinal crack','Transverse crack','Scab'];
const SEVERITIES=['CRITICAL','MAJOR','MINOR'];
const DISPOSITIONS=['Scarf','Downgrade','Concession','Reject','Scrap'];
const SOURCES=['Manual — Surface Insp.','Surface SIS','Caster surface cam'];
const SEV_COLOR={CRITICAL:'#d32f2f',MAJOR:'#f57c00',MINOR:'#fbc02d'};
const SEV_BADGE={CRITICAL:'b-crit',MAJOR:'b-maj',MINOR:'b-min'};
const DISP_BADGE={Scarf:'b-warn',Downgrade:'b-purple',Reject:'b-fail',Concession:'b-info',Scrap:'b-slate',Hold:'b-hold',Accept:'b-pass'};
const DISP_LABEL={Hold:'Manual QC Hold',Downgrade:'Downgrade — secondary',Scarf:'Edge grind / repair',Accept:'Accept (concession)',Concession:'Concession',Reject:'Reject',Scrap:'Scrap'};
function dispLabel(x){return DISP_LABEL[x]||x;}
/* location model derives from material form (all flat products are surface XY) */
const LINEAR_FORMS=['Bloom','Billet','Bar'];
function locType(form){return LINEAR_FORMS.includes(form)?'LINEAR':'SURFACE_XY';}
function locStr(m,d){return locType(m.form)==='LINEAR'?`L ${d.pos1} ${m.lenUnit}`:`X ${d.pos1} ${m.lenUnit} · Y ${d.pos2} mm · ${d.face}`;}
function nowHM(){const t=new Date();return String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');}

/* ============ data — heat H2601 -> slabs -> coil, current shift ============
   surface: pos1 = X along length (in lenUnit), pos2 = Y across width (mm), face = TOP|BOTTOM */
const MATERIALS=[
 {uid:'ISWHSM2C2601001',ref:'C2601',heat:'H2601',grade:'IS 2062 E250',form:'HR Coil',stage:'HSM-2 · Down Coiler',
  length:1055,lenUnit:'m',width:1250,widUnit:'mm',hold:true,holdReason:'an edge crack on the strip edge',holdSource:'online SIS',
  defects:[
   {id:1,defect:'Edge crack',severity:'CRITICAL',pos1:512,pos2:20,face:'TOP',disp:'Hold',source:'Surface SIS',ts:'15:44'},
   {id:2,defect:'Rolled-in scale',severity:'MINOR',pos1:280,pos2:640,face:'TOP',disp:'Concession',source:'Surface SIS',ts:'15:44'},
   {id:3,defect:'Sliver',severity:'MAJOR',pos1:806,pos2:1180,face:'BOTTOM',disp:'Downgrade',source:'Surface SIS',ts:'15:45'}
  ]},
 {uid:'ISWCC1H2601S001',heat:'H2601',grade:'IS 2062 E250',form:'Slab',stage:'SMS-2 · CCM1 (As Cast)',
  length:9200,lenUnit:'mm',width:1250,widUnit:'mm',
  defects:[
   {id:1,defect:'Transverse crack',severity:'MAJOR',pos1:3200,pos2:1180,face:'TOP',disp:'Scarf',source:'Caster surface cam',ts:'15:12'},
   {id:2,defect:'Inclusion',severity:'MINOR',pos1:6100,pos2:600,face:'TOP',disp:'Concession',source:'Manual — Surface Insp.',ts:'15:20'}
  ]},
 {uid:'ISWCC1H2601S002',heat:'H2601',grade:'IS 2062 E250',form:'Slab',stage:'SMS-2 · CCM1 (As Cast)',
  length:8650,lenUnit:'mm',width:1250,widUnit:'mm',
  defects:[
   {id:1,defect:'Longitudinal crack',severity:'MAJOR',pos1:4300,pos2:60,face:'TOP',disp:'Scarf',source:'Manual — Surface Insp.',ts:'15:26'},
   {id:2,defect:'Scab',severity:'MINOR',pos1:1500,pos2:900,face:'BOTTOM',disp:'Concession',source:'Manual — Surface Insp.',ts:'15:29'}
  ]},
 {uid:'ISWHSM2C2602001',ref:'C2602',heat:'H2602',grade:'IS 2062 E250',form:'HR Coil',stage:'HSM-2 · Down Coiler',
  length:1060,lenUnit:'m',width:1250,widUnit:'mm',
  defects:[
   {id:1,defect:'Roll mark',severity:'MINOR',pos1:300,pos2:625,face:'TOP',disp:'Concession',source:'Surface SIS',ts:'16:31'}
  ]}
];

let curIdx=0;
let curFace='TOP';          // active face for surface view
let activeDefect=null;       // highlighted marker/row id
const cur=()=>MATERIALS[curIdx];
const seqColor=s=>SEV_COLOR[s];

/* ============ list ============ */
function renderList(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  document.getElementById('list').innerHTML=MATERIALS.map((m,i)=>{
    if(q&&!(m.uid+' '+(m.ref||'')+' '+m.heat+' '+m.grade+' '+m.form).toLowerCase().includes(q))return'';
    return `<div class="litem ${i===curIdx?'sel':''}" onclick="sel(${i})">
      <div><div class="lh">${m.uid}</div><div class="lg">${m.heat} · ${m.grade} · ${m.form}</div></div>
      <span class="cbadge" title="${m.defects.length} defect(s)">${m.defects.length}</span></div>`;
  }).join('');
}
function sel(i){
  curIdx=i;curFace='TOP';
  const m=cur();
  const flagged=m.defects.find(d=>d.disp==='Hold')||m.defects[0];
  activeDefect=flagged?flagged.id:null;
  if(flagged&&flagged.face)curFace=flagged.face;
  renderDetail();renderList();
}

/* ============ SVG map ============ */
function linearSVG(m){
  const W=860,H=170, padL=46,padR=46, barY=64,barH=64;
  const x0=padL, x1=W-padR, span=x1-x0;
  const fx=p=>x0 + (p/m.length)*span;
  const ticks=[];for(let k=0;k<=6;k++){ticks.push(Math.round(m.length*k/6));}
  const tickEls=ticks.map(v=>{const X=fx(v);return `
    <line x1="${X}" y1="${barY+barH}" x2="${X}" y2="${barY+barH+6}" stroke="#bbb"/>
    <text x="${X}" y="${barY+barH+19}" class="ax" text-anchor="middle">${v}</text>`;}).join('');
  const marks=m.defects.map(d=>{const X=fx(d.pos1),Y=barY+barH/2;
    return `<circle class="dmark ${activeDefect===d.id?'active':''}" data-id="${d.id}" cx="${X}" cy="${Y}" r="9"
      fill="${seqColor(d.severity)}" stroke="#fff" stroke-width="1.5"/>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Linear defect map">
    <style>.ax{font:11px Roboto,sans-serif;fill:#888;} .lbl{font:600 11px Roboto,sans-serif;fill:#999;text-transform:uppercase;letter-spacing:.5px;}</style>
    <rect x="${x0}" y="${barY}" width="${span}" height="${barH}" rx="${barH/2}" fill="#eef2f5" stroke="#cfd8dd"/>
    <text x="${x0}" y="${barY-12}" class="lbl" text-anchor="start">Head</text>
    <text x="${x1}" y="${barY-12}" class="lbl" text-anchor="end">Tail</text>
    <line x1="${x0}" y1="${barY+barH}" x2="${x1}" y2="${barY+barH}" stroke="#ccc"/>
    ${tickEls}
    <text x="${(x0+x1)/2}" y="${H-4}" class="ax" text-anchor="middle">Length (${m.lenUnit}) — total ${m.length} ${m.lenUnit}</text>
    ${marks}
  </svg>`;
}
function surfaceSVG(m){
  const W=860,H=300, padL=46,padR=24,padT=30,padB=44;
  const x0=padL,x1=W-padR,y0=padT,y1=H-padB;
  const plateW=x1-x0;
  // aspect from a common unit (mm) so a long strip renders as a thin bar
  const lengthMM=m.lenUnit==='m'?m.length*1000:m.length;
  let plateH=plateW*(m.width/lengthMM);
  plateH=Math.max(70,Math.min(plateH,y1-y0));
  const px0=x0,py0=y0,pw=plateW,ph=plateH;
  const fx=p=>px0+(p/m.length)*pw;
  const fy=p=>py0+(p/m.width)*ph;
  let grid='';
  for(let k=1;k<6;k++){const X=px0+pw*k/6;grid+=`<line x1="${X}" y1="${py0}" x2="${X}" y2="${py0+ph}" stroke="#eef1f3"/>`;}
  for(let k=1;k<4;k++){const Y=py0+ph*k/4;grid+=`<line x1="${px0}" y1="${Y}" x2="${px0+pw}" y2="${Y}" stroke="#eef1f3"/>`;}
  let xt='';for(let k=0;k<=6;k++){const v=Math.round(m.length*k/6),X=fx(v);
    xt+=`<line x1="${X}" y1="${py0+ph}" x2="${X}" y2="${py0+ph+5}" stroke="#bbb"/><text x="${X}" y="${py0+ph+18}" class="ax" text-anchor="middle">${v}</text>`;}
  let yt='';for(let k=0;k<=2;k++){const v=Math.round(m.width*k/2),Y=fy(v);
    yt+=`<line x1="${px0-5}" y1="${Y}" x2="${px0}" y2="${Y}" stroke="#bbb"/><text x="${px0-9}" y="${Y+3}" class="ax" text-anchor="end">${v}</text>`;}
  const marks=m.defects.filter(d=>d.face===curFace).map(d=>{const X=fx(d.pos1),Y=fy(d.pos2);
    return `<circle class="dmark ${activeDefect===d.id?'active':''}" data-id="${d.id}" cx="${X}" cy="${Y}" r="8.5"
      fill="${seqColor(d.severity)}" stroke="#fff" stroke-width="1.5"/>`;}).join('');
  const hidden=m.defects.filter(d=>d.face!==curFace).length;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Surface XY defect map">
    <style>.ax{font:11px Roboto,sans-serif;fill:#888;} .lbl{font:600 11px Roboto,sans-serif;fill:#999;text-transform:uppercase;letter-spacing:.5px;}</style>
    <rect x="${px0}" y="${py0}" width="${pw}" height="${ph}" rx="3" fill="#eef2f5" stroke="#cfd8dd"/>
    ${grid}${xt}${yt}
    <text x="${px0}" y="${py0-9}" class="lbl" text-anchor="start">${curFace} face</text>
    <text x="${(px0+px0+pw)/2}" y="${H-6}" class="ax" text-anchor="middle">X — length (${m.lenUnit}), total ${m.length}</text>
    <text x="14" y="${py0+ph/2}" class="ax" text-anchor="middle" transform="rotate(-90 14 ${py0+ph/2})">Y — width (mm), total ${m.width}</text>
    ${marks}
    ${hidden?`<text x="${px0+pw}" y="${py0-9}" class="ax" text-anchor="end">${hidden} on other face</text>`:''}
  </svg>`;
}

/* ============ defect image review — pure-CSS capture placeholders ============ */
function shotsFor(m,d){
  const isSIS=/SIS/i.test(d.source), isCam=/Caster/i.test(d.source);
  const camBase=isSIS?'Surface SIS':(isCam?'Caster HMI':'Handheld scope');
  const label=isSIS?'SIS':(isCam?'CAM':'SCOPE');
  const views=[{v:'Surface overview',zoom:false},{v:'Defect zoom ×8',zoom:true}];
  if(d.severity==='CRITICAL')views.push({v:'Edge profile scan',zoom:true});
  return views.map((o,i)=>({view:o.v,zoom:o.zoom,cam:camBase+' · CAM-0'+(i+1),label,sis:isSIS}));
}
function shotHtml(m,d,s){
  const col=SEV_COLOR[d.severity];
  const xPct=s.zoom?50:Math.max(8,Math.min(92,(d.pos1/m.length)*100));
  const yPct=s.zoom?50:Math.max(12,Math.min(88,(d.pos2/m.width)*100));
  const mark=`<span class="shot-mark" style="left:${xPct}%;top:${yPct}%;border-color:${col};"></span>`;
  const scan=s.sis?'<span class="shot-scan"></span>':'';
  return `<div class="dm-shot">
    <div class="shot-img">
      <span class="grade-sheen"></span>${scan}
      <span class="shot-tag">${s.cam}</span>
      ${mark}
      <span class="shot-zoom"><i class="fa-solid ${s.zoom?'fa-magnifying-glass-plus':'fa-image'}"></i></span>
    </div>
    <div class="shot-cap">
      <b>${s.label} defect capture — ${d.defect.toLowerCase()}</b>
      <span>${s.view} · ${locStr(m,d)} · ${d.ts}</span>
    </div>
  </div>`;
}

/* ============ detail ============ */
function renderDetail(){
  const m=cur(),lt=locType(m.form);
  const chips=[m.ref?['Coil',m.ref]:null,['Heat',m.heat],['Grade',m.grade],['Form',m.form],['Stage',m.stage]]
    .filter(Boolean).map(p=>`<span class="chip">${p[0]}<b>${p[1]}</b></span>`).join('');

  const faceToggle = lt==='SURFACE_XY'
    ? `<div class="face-seg">${['TOP','BOTTOM'].map(f=>`<button class="${curFace===f?'on':''}" onclick="setFace('${f}')">${f[0]+f.slice(1).toLowerCase()}</button>`).join('')}</div>`
    : '';
  const svg = lt==='LINEAR' ? linearSVG(m) : surfaceSVG(m);
  const legend=`<div class="legend">${SEVERITIES.map(s=>`<span class="lg-item"><span class="swatch" style="background:${SEV_COLOR[s]}"></span>${s[0]+s.slice(1).toLowerCase()}</span>`).join('')}</div>`;

  const rows=m.defects.length?m.defects.map(d=>{
    const onFace = lt==='LINEAR' || d.face===curFace;
    return `<tr class="drow ${activeDefect===d.id?'active':''}" data-id="${d.id}" onclick="pick(${d.id})">
      <td><span class="dseq" style="background:${SEV_COLOR[d.severity]};${onFace?'':'opacity:.35'}">${onFace?'•':''}</span></td>
      <td><b>${d.defect}</b></td>
      <td><span class="badge ${SEV_BADGE[d.severity]}">${d.severity}</span></td>
      <td class="loc">${locStr(m,d)}</td>
      <td>${d.source}</td>
      <td><span class="badge ${DISP_BADGE[d.disp]}">${d.disp}</span></td>
      <td style="text-align:right"><button class="icon-btn" title="Delete" onclick="event.stopPropagation();delDefect(${d.id})"><i class="fa-solid fa-trash-can"></i></button></td>
    </tr>`;}).join('') : '';
  const tableSec = m.defects.length
    ? `<table class="dtable"><thead><tr><th style="width:34px"></th><th>Defect</th><th>Severity</th><th>Location</th><th>Detected by</th><th>Disposition</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty">No defects recorded for this material yet. Use “Add defect” to plot one.</div>`;

  const holdBanner = m.hold ? `
    <div class="alert alert-warning">
      <i class="fa-solid fa-hand"></i>
      <div><span class="a-title">Manual QC Hold</span> — ${m.uid} held after ${m.holdSource} flagged ${m.holdReason.toLowerCase()}. The coil cannot progress until a QC disposition is recorded.</div>
      <button class="btn btn-ghost btn-sm" style="margin-left:auto;white-space:nowrap" onclick="holdAction()"><i class="fa-solid fa-gavel"></i> Review &amp; disposition</button>
    </div>` : '';

  const gd = m.defects.find(x=>x.id===activeDefect) || m.defects[0];
  const gallerySec = m.defects.length ? `
    <section>
      <div class="gal-head">
        <div class="sec-title" style="margin:0">Defect capture &amp; image review${gd?` — <span style="color:var(--color-text-primary);text-transform:none;letter-spacing:0">${gd.defect}</span>`:''}</div>
        <button class="btn btn-ghost btn-sm" onclick="attachShot()"><i class="fa-solid fa-camera"></i> Attach capture</button>
      </div>
      <div class="dm-gallery">${gd?shotsFor(m,gd).map(s=>shotHtml(m,gd,s)).join(''):'<div class="empty">Select a defect to review its captures.</div>'}</div>
      <div class="hint mt-8"><i class="fa-solid fa-circle-info"></i> ${/SIS/i.test((gd||{}).source||'')?'Frames streamed from online surface inspection at the run-out table.':/Caster/i.test((gd||{}).source||'')?'Captured by the caster surface camera on the withdrawal roll.':'Captured at manual surface inspection.'}</div>
    </section>` : '';

  document.getElementById('detail').innerHTML=`
    <div class="dhead">
      <div><div class="dh-title"><i class="fa-solid fa-triangle-exclamation" style="color:var(--color-warning)"></i> ${m.uid}
        ${m.ref?`<span class="badge b-info">${m.ref}</span>`:''}
        <span class="badge ${m.defects.length?'b-fail':'b-pass'}">${m.defects.length} defect${m.defects.length===1?'':'s'}</span>
        ${m.hold?`<span class="badge b-hold"><i class="fa-solid fa-lock"></i> On hold</span>`:''}</div>
        <div class="chips">${chips}</div></div>
      <button class="btn btn-primary btn-sm" onclick="openAddDefect()"><i class="fa-solid fa-plus"></i> Add defect</button>
    </div>
    <div class="dbody">
      ${holdBanner}
      <section>
        <div class="sec-head">
          <div class="sec-title" style="margin:0">Defect map <span class="loc-tag">${lt==='LINEAR'?'Linear':'Surface XY'}</span></div>
          ${faceToggle}
        </div>
        <div class="map-card">
          <div class="map-bar">
            <div class="map-meta">${lt==='LINEAR'
              ? `Length <b>${m.length} ${m.lenUnit}</b> · ${m.form}`
              : `${m.form} <b>${m.length} ${m.lenUnit} × ${m.width} mm</b> · faces Top / Bottom`}</div>
            <div class="map-meta">Markers coloured by severity</div>
          </div>
          <div class="svg-wrap" id="svgWrap">${svg}<div class="tip" id="tip"></div></div>
          ${legend}
        </div>
      </section>
      ${gallerySec}
      <section>
        <div class="sec-title">Defect records (${m.defects.length})</div>
        ${tableSec}
      </section>
    </div>`;
  wireMarkers();
}

/* ============ marker interaction ============ */
function wireMarkers(){
  const wrap=document.getElementById('svgWrap');if(!wrap)return;
  const tip=document.getElementById('tip');
  wrap.querySelectorAll('.dmark').forEach(el=>{
    const id=+el.dataset.id;
    el.addEventListener('mousemove',e=>showTip(e,id));
    el.addEventListener('mouseenter',e=>showTip(e,id));
    el.addEventListener('mouseleave',()=>{tip.classList.remove('show');});
    el.addEventListener('click',()=>pick(id));
  });
  function showTip(e,id){
    const m=cur(),d=m.defects.find(x=>x.id===id);if(!d)return;
    const r=wrap.getBoundingClientRect();
    tip.innerHTML=`<b><span class="ts" style="background:${SEV_COLOR[d.severity]}"></span>${d.defect}</b>${d.severity} · ${locStr(m,d)} · ${d.disp}`;
    tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';
    tip.classList.add('show');
  }
}
function pick(id){activeDefect=(activeDefect===id?null:id);
  const m=cur();const d=m.defects.find(x=>x.id===id);
  if(d&&locType(m.form)==='SURFACE_XY'&&d.face!==curFace){curFace=d.face;}
  renderDetail();
}
function setFace(f){curFace=f;renderDetail();}

/* ============ delete ============ */
function delDefect(id){const m=cur();m.defects=m.defects.filter(d=>d.id!==id);if(activeDefect===id)activeDefect=(m.defects[0]||{}).id||null;renderDetail();renderList();}

/* ============ add-defect (MESC.modal) ============ */
function fopts(list,selected){return list.map(o=>`<option ${o===selected?'selected':''}>${o}</option>`).join('');}
function openAddDefect(){
  const m=cur();
  const formHtml=`
    <div class="fld full"><label>Defect</label><select id="f_def">${fopts(DEFECT_CATALOG)}</select></div>
    <div class="fld"><label>Severity</label><select id="f_sev">${fopts(SEVERITIES,'MAJOR')}</select></div>
    <div class="fld"><label>Disposition</label><select id="f_disp">${fopts(DISPOSITIONS,'Scarf')}</select></div>
    <div class="fld full"><label>Detected by</label><select id="f_src">${fopts(SOURCES,'Manual — Surface Insp.')}</select></div>
    <div class="fld"><label>X along length (${m.lenUnit})</label>
      <input id="f_p1" type="number" min="0" max="${m.length}" value="${Math.round(m.length/2)}">
      <div class="hint">0 … ${m.length} ${m.lenUnit}</div></div>
    <div class="fld"><label>Y across width (mm)</label>
      <input id="f_p2" type="number" min="0" max="${m.width}" value="${Math.round(m.width/2)}">
      <div class="hint">0 … ${m.width} mm</div></div>
    <div class="fld full"><label>Face</label><select id="f_face">${fopts(['TOP','BOTTOM'],curFace)}</select></div>`;
  const bodyEl=h('div',{class:'dm-form',html:formHtml});
  const modal=MESC.modal({
    title:'Add defect — '+m.uid, icon:'fa-location-dot',
    body:[bodyEl],
    footer:[ h('button',{class:'btn btn-ghost',onclick:()=>modal.close()},['Cancel']),
      h('button',{class:'btn btn-primary',onclick:()=>saveDefect(modal)},[MESC.icon('fa-plus'),' Save defect']) ]
  });
}
function saveDefect(modal){
  const m=cur();
  const p1=Math.round(Math.max(0,Math.min(+document.getElementById('f_p1').value||0,m.length)));
  const p2=Math.round(Math.max(0,Math.min(+document.getElementById('f_p2').value||0,m.width)));
  const rec={
    id:(m.defects.reduce((a,d)=>Math.max(a,d.id),0)+1),
    defect:document.getElementById('f_def').value,
    severity:document.getElementById('f_sev').value,
    disp:document.getElementById('f_disp').value,
    source:document.getElementById('f_src').value,
    ts:nowHM(), pos1:p1, pos2:p2,
    face:document.getElementById('f_face').value
  };
  m.defects.push(rec);curFace=rec.face;activeDefect=rec.id;
  modal.close();renderDetail();renderList();
  MESShell.toast('Defect logged on '+m.uid+' — '+rec.defect+' ('+rec.severity+')','success');
}

/* ============ Manual QC Hold — disposition ============ */
function holdAction(){
  const m=cur();
  const d=m.defects.find(x=>x.disp==='Hold')||m.defects[0];
  const formHtml=`
    <div class="fld full"><label>QC disposition</label>
      <select id="hd_disp">
        <option value="Hold">Retain Manual QC Hold</option>
        <option value="Downgrade">Downgrade to secondary (CR-2)</option>
        <option value="Scarf">Release for edge grinding / repair</option>
        <option value="Accept">Release to production (concession)</option>
      </select></div>
    <div class="fld full"><label>QC remark</label><input id="hd_note" placeholder="e.g. edge crack within 25 mm trim allowance"></div>`;
  const bodyEl=h('div',{class:'dm-form',html:formHtml});
  const modal=MESC.modal({
    title:'QC disposition — '+m.uid, icon:'fa-gavel',
    body:[ h('div',{class:'hint mb-8'},['Flagged by '+m.holdSource+' · '+d.defect+' at '+locStr(m,d)+'. Review the captures on the record before deciding.']), bodyEl ],
    footer:[ h('button',{class:'btn btn-ghost',onclick:()=>modal.close()},['Cancel']),
      h('button',{class:'btn btn-primary',onclick:()=>{
        const dispv=document.getElementById('hd_disp').value;
        d.disp=dispv;
        if(dispv==='Hold'){ modal.close(); renderDetail(); MESShell.toast(m.uid+' — Manual QC Hold retained','warning'); }
        else { m.hold=false; modal.close(); renderDetail(); renderList();
          MESShell.toast(m.uid+' released — disposition: '+dispLabel(dispv),'success'); }
      }},[MESC.icon('fa-check'),' Confirm disposition']) ]
  });
}
function attachShot(){ MESShell.toast('Capture device — connect handheld camera / microscope to attach an image','info'); }

/* ============ init ============ */
document.getElementById('search').oninput=renderList;
sel(0);
</script>
</body>
</html>
