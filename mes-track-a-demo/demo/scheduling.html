<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scheduling — Bluemingo MES</title>
<link href="assets/vendor/roboto/roboto.css" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="assets/mes-styles.css">
<style>
  .ctrl-bar { display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  .ctrl-bar .field { margin-bottom:0; min-width:120px; }
  .rationale { display:flex; gap:6px; flex-wrap:wrap; margin:2px 0 12px; }
  .hotcharge-card { border-left:3px solid var(--color-warning); }
  .ladle-life { height:6px; background:var(--color-border-light); border-radius:4px; overflow:hidden; width:80px; }
  .ladle-life > span { display:block; height:100%; background:var(--color-success); }
  .ladle-life.warn > span { background:var(--color-warning); }
  .so-flash { animation:soflash 1.1s ease-out 1; }
  @keyframes soflash { 0%{ background:var(--color-primary-light); } 100%{ background:transparent; } }

  /* ---- jazzy gantt ---- */
  .gantt { border:none; border-radius:10px; background:linear-gradient(180deg,#ffffff,#f7fafd); box-shadow:0 3px 16px rgba(20,40,80,.08); }
  .gantt-row { min-height:38px; border-bottom:1px solid #eef2f7; }
  .gantt-row.head { background:linear-gradient(180deg,#f3f7fb,#eef3f9); }
  .gantt-lane-label { width:128px; background:linear-gradient(90deg,#f5f9fd,#ffffff); font-weight:700; }
  .gantt-bar { height:26px; top:6px; border-radius:6px; font-weight:700; letter-spacing:.2px; box-shadow:0 2px 6px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.30); transition:transform .12s ease, box-shadow .12s ease; animation:barIn .5s cubic-bezier(.2,.85,.25,1) both; }
  .gantt-bar:hover { transform:translateY(-2px); box-shadow:0 7px 16px rgba(0,0,0,.28); z-index:6; }
  @keyframes barIn { from{ opacity:0; transform:translateY(7px); } to{ opacity:1; transform:translateY(0); } }
  .gantt-bar.g-bof { background:linear-gradient(135deg,#45c0f5,#1e8fbf); }
  .gantt-bar.g-lhf { background:linear-gradient(135deg,#9b7ddb,#5e35b1); }
  .gantt-bar.g-rh  { background:linear-gradient(135deg,#4fd6c8,#00897b); }
  .gantt-bar.g-ccm { background:linear-gradient(135deg,#69c46d,#2e7d32); }
  /* HSM-2 rolling lanes */
  .gantt-bar.g-rhf    { background:linear-gradient(135deg,#ffab6b,#e8641c); }
  .gantt-bar.g-rough  { background:linear-gradient(135deg,#5cc6f7,#0277bd); }
  .gantt-bar.g-fin    { background:linear-gradient(135deg,#c084d8,#7b1fa2); }
  .gantt-bar.g-coiler { background:linear-gradient(135deg,#5fbf8a,#2e7d5b); }
  .gantt-bar.g-ccm.seq { border-radius:3px; box-shadow:0 2px 7px rgba(46,125,50,.30), inset 0 0 0 1px rgba(255,255,255,.35); }
  .gantt-bar.g-ccm.seq::before { content:''; position:absolute; inset:0; background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%); transform:translateX(-130%); animation:sheen 3.2s ease-in-out infinite; }
  @keyframes sheen { 0%{ transform:translateX(-130%); } 55%,100%{ transform:translateX(130%); } }
  .gantt-bar.setup { background:repeating-linear-gradient(45deg,#b0bec5,#b0bec5 4px,#cfd8dc 4px,#cfd8dc 8px); opacity:.95; }

  /* expandable heat -> slabs */
  .exp-btn i { transition:transform .15s; }
  .exp-btn.open i { transform:rotate(90deg); color:var(--color-primary); }
  tr.slab-detail > td { background:var(--color-bg-alt); padding:0; }
  .slab-detail-wrap { padding:10px 14px 12px 40px; border-left:3px solid var(--color-primary); }
  .slab-detail-wrap .bm-table { background:#fff; }
</style>
</head>
<body>
<script src="assets/mes-data.js"></script>
<script src="assets/mes-shell.js"></script>
<script src="assets/mes-components.js"></script>
<script>
const D = MES_DATA;
const { body } = MESShell.mount({ active: 'scheduling', title: 'Scheduling & Order Management', crumb: ['Planning', 'SMS-2 / HSM-2'] });

// ---------- module state ----------
let sequenced = false, bofDown = null, assignedLadle = null, breakdownEntry = null;
let soClock = 16 * 60 + 12;  // 16:12, increments per received SO

const tabs = MESC.tabs([
  { id: 'orders', label: 'Order Management', icon: 'fa-file-invoice', render: renderOrders },
  { id: 'sched',  label: 'SMS-2 Schedule',  icon: 'fa-calendar-days', render: renderSchedule },
  { id: 'rolling', label: 'HSM-2 Rolling Schedule', icon: 'fa-scroll', render: renderRolling },
  { id: 'ladle',  label: 'Ladle Scheduling', icon: 'fa-flask-vial', render: renderLadle }
]);
body.appendChild(tabs);

/* ===================== A1.1 — ORDER MANAGEMENT ===================== */
function renderOrders() {
  const wrap = h('div', {});
  const book = D.orders.map(o => Object.assign({}, o));     // working order book
  const inbox = D.sapInbox.map(o => Object.assign({}, o));   // pending SOs in SAP (queue)

  const invHost = h('span', {});
  const tableHost = h('div', {});
  const detailHost = h('div', { class: 'mt-12' });
  function drawInv() { invHost.innerHTML = ''; invHost.appendChild(MESC.badge('SAP-SD inbox · ' + inbox.length + ' pending', inbox.length ? 'warning' : 'neutral', 'fa-inbox')); }

  const actions = h('div', { class: 'row gap-8 mb-12', style: 'align-items:center;flex-wrap:wrap' }, [
    h('button', { class: 'btn btn-primary', onclick: receiveSO }, [MESC.icon('fa-download'), 'Receive Sales Order from SAP-SD']),
    invHost,
    h('span', { class: 'hint' }, ['Each click pulls the next pending ORDERS05 IDoc from SAP-SD into the MES order book and returns an ACK.'])
  ]);
  wrap.appendChild(MESC.card({ title: 'Order Book', icon: 'fa-book', body: [actions, tableHost] }));
  wrap.appendChild(detailHost);

  function drawTable() {
    tableHost.innerHTML = '';
    tableHost.appendChild(MESC.table([
      { key: 'no', label: 'Sales Order', render: r => h('span', {}, [h('span', { class: 'strong mono' }, [r.no]), r._new ? MESC.badge('New', 'info') : null]) },
      { key: 'line', label: 'Line' },
      { key: 'customer', label: 'Customer' },
      { key: 'material', label: 'Material' },
      { key: 'grade', label: 'Grade' },
      { key: 'qty', label: 'Qty (MT)', num: true, render: r => MESC.fmt(r.qty) },
      { key: 'dims', label: 'Dimensions', render: r => h('span', { class: 'hint mono' }, [r.thickness + ' × ' + r.width]) },
      { key: 'delivery', label: 'Delivery' },
      { key: 'status', label: 'Status', render: r => MESC.statusBadge(r.status) }
    ], book, { rowClass: r => r._new ? 'is-selected so-flash' : '', onRow: r => drawDetail(r) }));
  }

  function drawDetail(o) {
    detailHost.innerHTML = '';
    detailHost.appendChild(MESC.card({
      title: 'Order ' + o.no + ' / ' + o.line + (o._new ? ' — received from SAP-SD' : ''), icon: 'fa-file-invoice',
      right: o._new ? MESC.badge('ACK returned to SAP', 'success', 'fa-check') : MESC.statusBadge(o.status),
      body: [
        MESC.kvGrid([
          ['Customer', o.customer], ['Material', o.material], ['Grade', o.grade],
          ['Quantity', MESC.fmt(o.qty) + ' ' + (o.uom || 'MT')], ['Thickness', o.thickness], ['Width', o.width],
          ['Delivery date', o.delivery], ['Customer PO', o.po || '—'], ['Source', o.source || 'SAP-SD'],
          ['SAP IDoc', o.idoc || '—'], ['Received', o.received || '—']
        ]),
        o._new ? h('div', { class: 'divider' }) : null,
        o._new ? MESC.messageLog([
          { ts: (o.received || '').slice(-5), tag: 'SAP-SD', text: 'Inbound IDoc ' + o.idoc + ' (ORDERS05) received — customer PO ' + o.po + '.', cls: 'in' },
          { ts: (o.received || '').slice(-5), tag: 'MES', text: 'Order ' + o.no + '/' + o.line + ' created · elaboration rules applied (grade / dims / qty / delivery date).', cls: 'ok' },
          { ts: (o.received || '').slice(-5), tag: 'MES → SAP', text: 'Functional ACK (ALEAUD) returned to SAP-SD · order status Created.', cls: 'ok' }
        ]) : null,
        h('div', { class: 'row gap-8 mt-8' }, [
          h('button', { class: 'btn btn-success', onclick: () => tabs.activate('sched') }, [MESC.icon('fa-diagram-next'), 'Generate SMS-2 Heat Plan'])
        ])
      ]
    }));
  }

  function receiveSO() {
    if (!inbox.length) { MESShell.toast('SAP-SD inbox empty — no more pending sales orders', 'info'); return; }
    const so = inbox.shift();
    so._new = true; so.status = 'Created'; so.source = 'SAP-SD'; so.received = soStamp();
    book.unshift(so); drawInv(); drawTable(); drawDetail(so);
    MESShell.toast('SO ' + so.no + ' received from SAP-SD (IDoc ' + so.idoc + ') — Order object created, ACK returned', 'success');
  }

  drawInv(); drawTable();
  return wrap;
}
function soStamp() { soClock += 7; return '09 Jul 2026 ' + String(Math.floor(soClock / 60) % 24).padStart(2, '0') + ':' + String(soClock % 60).padStart(2, '0'); }

/* ===================== A1.1 — SMS-2 SCHEDULE + GANTT ===================== */
function renderSchedule() {
  const wrap = h('div', {});
  const controls = MESC.card({
    title: 'Create SMS-2 Schedule', icon: 'fa-sliders',
    body: [
      h('div', { class: 'ctrl-bar' }, [
        field('Planning horizon', selectEl(['24 hrs', '12 hrs', '48 hrs'])),
        field('BOFs active', selectEl(['3 (BOF1·BOF2·BOF3)', '2', '1'])),
        field('CCM strands', selectEl(['2 (CCM1·CCM2)', '1'])),
        h('button', { class: 'btn btn-primary', onclick: () => { sequenced = true; bofDown = null; draw(); MESShell.toast('Heats auto-sequenced — SMS-2 time plan generated', 'success'); } }, [MESC.icon('fa-wand-magic-sparkles'), 'Auto-sequence heats']),
        h('button', { id: 'btn-breakdown', class: 'btn btn-danger', disabled: 'true', onclick: () => breakdownModal() }, [MESC.icon('fa-bolt'), 'Log BOF2 breakdown']),
        h('button', { class: 'btn btn-ghost', onclick: () => { sequenced = false; bofDown = null; breakdownEntry = null; draw(); } }, [MESC.icon('fa-rotate-left'), 'Reset'])
      ])
    ]
  });
  wrap.appendChild(controls);
  const out = h('div', { class: 'mt-12' });
  wrap.appendChild(out);

  function breakdownModal() {
    const reasons = ['Trunnion bearing failure', 'Lance hoist hydraulic failure', 'Off-gas hood / ID-fan fault', 'Refractory lining damage', 'Tilt drive motor failure'];
    const reasonSel = h('select', {}, reasons.map(o => h('option', {}, [o])));
    const detectInput = h('input', { value: '16:24', style: 'width:110px' });
    const estInput = h('input', { type: 'number', step: '0.5', min: '0.5', value: '3.5', style: 'width:110px' });
    const modal = MESC.modal({
      title: 'Equipment Breakdown Entry — BOF2', icon: 'fa-triangle-exclamation', size: 'md',
      body: [
        MESC.alert('warning', 'Log unplanned breakdown', 'Record the BOF2 breakdown with an estimated downtime. The scheduler re-sequences heats around the outage window and flags the delay to SAP-PM.'),
        h('div', { class: 'form-row mt-8' }, [field('Equipment', roInput('BOF2 · Basic Oxygen Furnace 2'))]),
        h('div', { class: 'form-row' }, [field('Breakdown reason', reasonSel), field('Type', roInput('Unplanned'))]),
        h('div', { class: 'form-row' }, [field('Detected at', detectInput), field('Estimated downtime (hrs)', estInput)]),
        h('div', { class: 'hint mt-8' }, [MESC.icon('fa-circle-info'), ' Estimated restoration time determines how many heats are re-slotted to BOF1 / BOF3.'])
      ],
      footer: [
        h('button', { class: 'btn btn-ghost', onclick: () => modal.close() }, ['Cancel']),
        h('button', { class: 'btn btn-danger', onclick: () => {
          breakdownEntry = { reason: reasonSel.value, detectedAt: detectInput.value, estHrs: parseFloat(estInput.value) || 0 };
          bofDown = 'BOF2'; modal.close(); draw();
          MESShell.toast('BOF2 breakdown logged — est. ' + breakdownEntry.estHrs + ' h downtime; heats re-sequenced, SAP-PM notified', 'danger');
        } }, [MESC.icon('fa-bolt'), 'Log breakdown & reschedule'])
      ]
    });
  }

  function draw() {
    const btn = document.getElementById('btn-breakdown'); if (btn) btn.disabled = !sequenced || !!bofDown;
    out.innerHTML = '';
    if (!sequenced) { out.appendChild(MESC.card({ body: [h('div', { class: 'center muted', style: 'padding:24px' }, [MESC.icon('fa-calendar-plus'), ' Click ', h('strong', {}, ['Auto-sequence heats']), ' to generate the SMS-2 time plan.'])] })); return; }

    if (bofDown) {
      const be = breakdownEntry || { reason: 'Equipment fault', detectedAt: '16:24', estHrs: 3.5 };
      const nHit = D.schedule.heats.filter(x => x.bof === 'BOF2').length;
      out.appendChild(MESC.card({
        class: 'hotcharge-card', title: 'Equipment Breakdown — BOF2', icon: 'fa-triangle-exclamation',
        right: MESC.badge('Flagged for SAP-PM', 'warning', 'fa-share'),
        body: [
          MESC.kvGrid([
            ['Equipment', 'BOF2 · Basic Oxygen Furnace 2'],
            ['Reason', h('span', { class: 'strong' }, [be.reason])],
            ['Type', MESC.badge('Unplanned', 'danger')],
            ['Detected at', h('span', { class: 'mono' }, [be.detectedAt])],
            ['Estimated downtime', h('span', { class: 'strong' }, [be.estHrs + ' hrs'])],
            ['Estimated restoration', h('span', { class: 'mono strong' }, [addHrs(be.detectedAt, be.estHrs)])],
            ['BOF availability', '3 → 2 (BOF1 · BOF3)'],
            ['Impact', nHit + ' heats re-sequenced for the outage window']
          ]),
          MESC.alert('warning', 'Reactive re-scheduling triggered', nHit + ' heats scheduled on BOF2 auto-shifted to BOF1 / BOF3 across the ' + be.estHrs + ' h outage; campaign resequenced. Revised schedule ready in 4m 12s (target < 5 min). Planner + shift alerted; delay flagged to SAP-PM.')
        ]
      }));
    }

    // rationale
    out.appendChild(h('div', { class: 'rationale' }, [
      pill('fa-layer-group', 'Grade nesting'), pill('fa-flask-vial', 'Ladle availability'), pill('fa-arrows-split-up-and-left', 'Strand assignment'),
      pill('fa-ruler-horizontal', 'Width hierarchy'), pill('fa-clock', 'Tundish life'), bofDown ? MESC.badge('BOF2 OFFLINE', 'danger', 'fa-triangle-exclamation') : null
    ]));

    // sequence table
    const seq = buildSequence();
    out.appendChild(MESC.card({
      title: 'Heat Sequence — Time Plan', icon: 'fa-list-ol',
      right: seq.length + ' heats · 24h horizon',
      body: [MESC.table([
        { key: 'exp', label: '', render: r => { const b = h('button', { class: 'btn btn-ghost btn-sm exp-btn', title: 'Expand — slabs cast from this heat' }, [MESC.icon('fa-chevron-right')]); b.addEventListener('click', () => toggleSlabs(r, b.closest('tr'), b)); return b; } },
        { key: 'seq', label: '#', render: (r, i) => String(i + 1) },
        { key: 'no', label: 'Heat', render: r => h('span', { class: 'strong mono' }, [r.no]) },
        { key: 'grade', label: 'Grade', render: r => h('span', { class: 'row gap-6', style: 'align-items:center' }, [r.grade, h('button', { class: 'btn btn-ghost btn-sm', title: 'Chemistry spec (min/max) + open QC', onclick: () => chemSpecModal(r) }, [MESC.icon('fa-flask')])]) },
        { key: 'slab', label: 'Slab T×W', render: () => h('span', { class: 'mono hint' }, [D.schedule.slab.thk + ' × ' + D.schedule.slab.width + ' mm']) },
        { key: 'tonnage', label: 'Tonnage', num: true, render: r => h('span', { class: 'mono' }, [r.tonnage + ' MT']) },
        { key: 'ladle', label: 'Ladle', render: r => h('span', { class: 'mono' }, [r.ladle]) },
        { key: 'bfTap', label: 'BF Tap No.', render: r => h('span', { class: 'mono hint' }, [r.bfTap]) },
        { key: 'bof', label: 'BOF', render: r => r.moved ? h('span', {}, [MESC.badge(r.bof, 'warning'), h('span', { class: 'hint' }, [' ← BOF2'])]) : r.bof },
        { key: 'ccm', label: 'Strand' }
      ], seq) ]
    }));

    // gantt
    const lanes = ['BOF1', 'BOF2', 'BOF3', 'LHF', 'RH', 'CCM1', 'CCM2'];
    const bars = buildBars(seq);
    const g = MESC.gantt(lanes, bars, { pxPerMin: 1.0, totalMin: 780, tickMin: 60 });
    out.appendChild(MESC.card({ title: 'SMS-2 Time Plan — Gantt', icon: 'fa-chart-gantt', right: 'setup · processing · buffer', tight: true, body: [h('div', { style: 'padding:10px' }, [
      h('div', { class: 'hint', style: 'margin-bottom:8px;display:flex;align-items:center;gap:7px;flex-wrap:wrap' }, [MESC.icon('fa-infinity'), h('b', {}, ['CCM1 / CCM2 cast continuously']), ' — same-grade heats run back-to-back (no gap); a grade change triggers a setup (tundish + mould). All grades share slab ' + D.schedule.slab.thk + ' × ' + D.schedule.slab.width + ' mm, so a size change adds no setup this campaign.']),
      g, legend()])] }));

    // hot charge — decided per slab: only the still-hot slabs go straight to the RHF charging table
    const hotSlabs = seq.flatMap(hd => slabsForHeat(hd)
      .filter(s => s.charge === 'Hot')
      .map(s => ({ id: s.id, heat: hd.no, grade: hd.grade, ccm: hd.ccm, wt: s.wt })));
    out.appendChild(MESC.card({
      class: 'hotcharge-card', title: 'Hot-Charging — Charging Table Queue (→ HSM-2 RHF)', icon: 'fa-fire',
      right: hotSlabs.length + ' slabs flagged',
      body: [
        h('div', { class: 'flow mb-8' }, [step('CCM cut', 'done'), arrow(), step('Direct hot path', 'current'), arrow(), step('HSM-2 Charging Table', 'current'), arrow(), step('RHF', '')]),
        h('div', { class: 'hint mb-8' }, [MESC.icon('fa-fire'), ' Hot-charging is a per-slab decision — only slabs still hot enough go straight to the RHF charging table; the rest cool in the SYMS yard.']),
        MESC.table([
          { key: 'id', label: 'Slab', render: r => h('span', { class: 'mono strong' }, [r.id]) },
          { key: 'heat', label: 'Heat', render: r => h('span', { class: 'mono' }, [r.heat]) },
          { key: 'grade', label: 'Grade' },
          { key: 'ccm', label: 'Cast strand' },
          { key: 'wt', label: 'Weight', num: true, render: r => r.wt + ' MT' },
          { key: 'tag', label: 'Allocation', render: () => MESC.badge('Charging-table queue', 'warning', 'fa-fire') }
        ], hotSlabs)
      ]
    }));
  }

  draw();
  return wrap;
}

// forward scheduler over shared units
function buildSequence() {
  const d = D.schedule.durations;
  const alt = ['BOF1', 'BOF3']; let ai = 0;
  return D.schedule.heats.map(hd => {
    let bof = hd.bof, moved = false;
    if (bofDown && bof === bofDown) { bof = alt[ai++ % 2]; moved = true; }
    return { no: hd.no, grade: hd.grade, tonnage: hd.tonnage, ladle: hd.ladle, bfTap: hd.bfTap, bof, ccm: hd.ccm, start: hd.start, hotCharge: hd.hotCharge, moved };
  });
}
function buildBars(seq) {
  const d = D.schedule.durations; const free = {}; const bars = []; const prevGrade = {};
  const at = (lane, want) => Math.max(want, free[lane] || 0);
  seq.forEach(s => {
    let t = at(s.bof, s.start);
    bars.push({ lane: s.bof, start: t, dur: d.BOF, label: s.no, cls: 'g-bof' + (s.moved ? ' moved' : ''), title: s.no + ' @ ' + s.bof });
    free[s.bof] = t + d.BOF + d.setup; let a = t + d.BOF + d.buffer;
    let l = at('LHF', a); bars.push({ lane: 'LHF', start: l, dur: d.LHF, label: s.no, cls: 'g-lhf' }); free['LHF'] = l + d.LHF + d.setup; a = l + d.LHF + d.buffer;
    let r = at('RH', a); bars.push({ lane: 'RH', start: r, dur: d.RH, label: s.no, cls: 'g-rh' }); free['RH'] = r + d.RH + d.setup; a = r + d.RH + d.buffer;
    // CCM continuous caster: same grade+size casts back-to-back (no gap); a grade/size change inserts a setup (tundish + mould width).
    let c;
    if (free[s.ccm] == null) { c = a; }
    else if (prevGrade[s.ccm] !== s.grade) { bars.push({ lane: s.ccm, start: free[s.ccm], dur: d.setup, label: '', cls: 'setup', title: 'Grade-change setup (tundish + mould) ' + prevGrade[s.ccm] + ' → ' + s.grade }); c = Math.max(free[s.ccm] + d.setup, a); }
    else { c = Math.max(free[s.ccm], a); }
    bars.push({ lane: s.ccm, start: c, dur: d.CCM, label: s.no, cls: 'g-ccm seq', title: s.no + ' cast @ ' + s.ccm + ' · ' + s.grade });
    free[s.ccm] = c + d.CCM; prevGrade[s.ccm] = s.grade;
  });
  return bars;
}

/* ===================== A1.2 — LADLE SCHEDULING ===================== */
/* A1.1: chemistry linkage — grade min/max spec + open the QC chemistry screen */
function chemSpecModal(r){
  const spec = (D.gradeSpecs && D.gradeSpecs[r.grade]) || [];
  const f = v => v==null ? '' : (Math.round(v*1000)/1000).toString();
  const rows = spec.map(e => '<tr><td><b>'+e.el+'</b></td><td class="num mono">'+(e.min==null?'—':f(e.min))+'</td><td class="num mono">'+(e.max==null?'—':f(e.max))+'</td><td class="hint">'+(e.min==null||e.min===0?'≤ '+f(e.max)+' %':f(e.min)+'–'+f(e.max)+' %')+'</td></tr>').join('');
  const modal = MESC.modal({
    title:'Chemistry Spec — '+r.grade+' · Heat '+r.no, icon:'fa-flask', size:'lg',
    body:[
      h('div',{class:'hint mb-8'},['Typical ladle chemistry (min / max, weight %) per the '+r.grade+' TDC. Heat '+r.no+' · '+r.tonnage+' MT · ladle '+r.ladle+' · slab '+D.schedule.slab.thk+' × '+D.schedule.slab.width+' mm · hot metal from BF tap '+r.bfTap+'.']),
      h('div',{class:'table-wrap'},[ h('table',{class:'bm-table', html:'<thead><tr><th>Element</th><th class="num">Min</th><th class="num">Max</th><th>Range</th></tr></thead><tbody>'+rows+'</tbody>'}) ])
    ],
    footer:[
      h('button',{class:'btn btn-ghost',onclick:()=>modal.close()},['Close']),
      h('button',{class:'btn btn-primary',onclick:()=>{ window.location.href='quality-chemistry.html'; }},[MESC.icon('fa-flask-vial'),'Open Heat Chemistry (QC)'])
    ]
  });
}
function renderLadle() {
  const wrap = h('div', {});
  const host = h('div', {});
  wrap.appendChild(host);

  function draw() {
    host.innerHTML = '';
    // inventory
    host.appendChild(MESC.card({
      title: 'Ladle Inventory', icon: 'fa-flask-vial', right: D.ladles.length + ' ladles · LP bay',
      body: [MESC.table([
        { key: 'id', label: 'Ladle', render: r => h('span', { class: 'mono strong' }, [r.id, r.id === assignedLadle ? MESC.badge('Locked · H2601', 'info', 'fa-lock') : null]) },
        { key: 'status', label: 'Status', render: r => MESC.statusBadge(r.id === assignedLadle ? 'in-use' : r.status) },
        { key: 'lining', label: 'Lining', render: r => r.lining === 'OK' ? r.lining : MESC.badge(r.lining, 'warning') },
        { key: 'heatsLeft', label: 'Heats to relining', render: r => lifeBar(r.heatsLeft, r.life) },
        { key: 'temp', label: 'Temp', render: r => r.temp },
        { key: 'act', label: '', render: r => (r.status === 'available' && !assignedLadle) ? h('button', { class: 'btn btn-outline btn-sm', onclick: () => assign(r) }, ['Assign to H2601']) : '' }
      ], D.ladles)]
    }));

    // assignment status
    if (assignedLadle) host.appendChild(MESC.alert('success', 'Ladle assigned', assignedLadle + ' validated (availability + temperature history) and locked to Heat H2601 at BOF1 tapping.'));

    // ladle schedule aligned to time plan — derived from the heats + ladle inventory; conflicts flagged with reason
    const lrows = buildLadleSchedule();
    const nConf = lrows.filter(r => r.conflict).length;
    host.appendChild(MESC.card({
      title: 'Ladle Schedule — aligned to SMS-2 Time Plan', icon: 'fa-timeline',
      right: [MESC.badge(lrows.length + ' taps', 'neutral'), nConf ? MESC.badge(nConf + ' conflict' + (nConf > 1 ? 's' : ''), 'danger', 'fa-triangle-exclamation') : MESC.badge('no conflicts', 'success', 'fa-check')],
      body: [MESC.table([
        { key: 'ladle', label: 'Ladle', render: r => h('span', { class: 'mono strong' }, [r.ladle]) },
        { key: 'heat', label: 'Heat', render: r => h('span', { class: 'mono' }, [r.heat]) },
        { key: 'grade', label: 'Grade', render: r => h('span', { class: 'hint' }, [r.grade]) },
        { key: 'tap', label: 'BOF tap', render: r => h('span', { class: 'mono' }, [r.tap]) },
        { key: 'ret', label: 'Return / turnaround', render: r => h('span', { class: r.conflict ? 'strong' : 'mono hint', style: r.conflict ? 'color:var(--color-danger)' : '' }, [r.ret]) },
        { key: 'life', label: 'Ladle life', render: r => lifeBar(r.heatsLeft, 60) },
        { key: 'st', label: 'Status', render: r => r.conflict ? h('div', {}, [MESC.badge('Conflict', 'danger', 'fa-triangle-exclamation'), h('div', { class: 'hint', style: 'font-size:10.5px;margin-top:3px;color:var(--color-danger)' }, [r.reason])]) : MESC.statusBadge('ok', 'OK') }
      ], lrows, { rowClass: r => r.conflict ? 'is-selected' : '' })]
    }));
  }

  function assign(r) {
    if (r.heatsLeft <= 5) { MESShell.toast('Warning: ' + r.id + ' near relining limit — supervisor override needed', 'warning'); }
    assignedLadle = r.id; draw();
    MESShell.toast(r.id + ' assigned & locked to Heat H2601 @ BOF1 tapping', 'success');
  }
  draw();
  return wrap;
}

/* ---------- small local helpers ---------- */
function field(label, ctrl) { return h('div', { class: 'field' }, [h('label', {}, [label]), ctrl]); }
/* Expand a heat -> the slabs it casts (id / size / weight / grade / charge / destination) */
function slabsForHeat(hd){
  const thk = D.schedule.slab.thk, w = D.schedule.slab.width;
  const n = Math.max(4, Math.round(hd.tonnage / 27));
  const usable = hd.tonnage - 2;                 // ~2 MT skull / scrap loss
  const each = Math.round(usable / n * 10) / 10;
  const strandN = hd.ccm.slice(-1);
  const slabs = []; let acc = 0;
  for (let i = 0; i < n; i++) {
    const wt = (i === n - 1) ? Math.round((usable - acc) * 10) / 10 : each;
    acc += wt;
    const len = Math.round(wt / (thk / 1000 * w / 1000 * 7.85) * 1000);
    slabs.push({ id: 'ISWCC' + strandN + hd.no + 'S' + String(i + 1).padStart(3, '0'), size: thk + ' × ' + w + ' × ' + len + ' mm', wt: wt.toFixed(1), grade: hd.grade, charge: (hd.hotCharge && i < 3) ? 'Hot' : 'Cold' });
  }
  return slabs;
}
function slabsTable(slabs){
  return MESC.table([
    { label: 'Slab ID', render: s => h('span', { class: 'mono strong' }, [s.id]) },
    { label: 'Size (T × W × L)', render: s => h('span', { class: 'mono hint' }, [s.size]) },
    { label: 'Weight', num: true, render: s => s.wt + ' MT' },
    { label: 'Grade', render: s => s.grade },
    { label: 'Charge', render: s => s.charge === 'Hot' ? MESC.badge('Hot Charge', 'warning', 'fa-fire') : MESC.badge('Cold', 'neutral', 'fa-snowflake') },
    { label: 'Destination', render: s => s.charge === 'Hot' ? 'HSM-2 charging table (direct)' : 'SYMS slab yard' },
    { label: 'Status', render: () => MESC.badge('Cast', 'info') }
  ], slabs);
}
function toggleSlabs(r, tr, btn){
  const nx = tr.nextElementSibling;
  if (nx && nx.classList.contains('slab-detail')) { nx.remove(); btn.classList.remove('open'); return; }
  const slabs = slabsForHeat(r), hot = slabs.filter(s => s.charge === 'Hot').length;
  const dtr = document.createElement('tr'); dtr.className = 'slab-detail';
  const td = document.createElement('td'); td.colSpan = tr.children.length;
  td.appendChild(h('div', { class: 'slab-detail-wrap' }, [
    h('div', { class: 'hint mb-8' }, [MESC.icon('fa-cubes-stacked'), ' ' + slabs.length + ' slabs cast from heat ' + r.no + ' · ' + r.grade + ' · ' + r.tonnage + ' MT on ' + r.ccm + ' — ' + hot + ' hot-charged to HSM-2, ' + (slabs.length - hot) + ' to SYMS yard.']),
    slabsTable(slabs)
  ]));
  dtr.appendChild(td); tr.after(dtr); btn.classList.add('open');
}
function roInput(v) { return h('input', { value: v, readonly: 'true' }); }
function addHrs(hhmm, hrs) { const p = String(hhmm || '0:0').split(':').map(Number); let t = (p[0] * 60 + (p[1] || 0) + Math.round((+hrs || 0) * 60)); const d = t >= 1440 ? ' +1d' : ''; t %= 1440; return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0') + d; }
function selectEl(opts) { return h('select', {}, opts.map(o => h('option', {}, [o]))); }
function pill(ic, t) { return h('span', { class: 'pill' }, [MESC.icon(ic), t]); }
function fmtT(mins) { const base = 15 * 60 + 42; const m = base + mins; return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function step(t, cls) { return h('span', { class: 'step ' + (cls || '') }, [h('span', { class: 's-dot' }), t]); }
function arrow() { return h('span', { class: 'arrow' }, [MESC.icon('fa-chevron-right')]); }
function lifeBar(left, life) {
  const pct = Math.max(0, Math.min(100, Math.round(left / life * 100)));
  const warn = left <= 5;
  return h('div', { class: 'row gap-8', style: 'align-items:center' }, [
    h('div', { class: 'ladle-life' + (warn ? ' warn' : '') }, [h('span', { style: 'width:' + pct + '%' })]),
    h('span', { class: 'hint mono' }, [left + ' / ' + life])
  ]);
}
/* HSM-2 rolling schedule — cast slabs rolled into hot-rolled coils, sequenced as a rolling program */
/* A1.2: ladle schedule derived from the heats + ladle inventory; flags near-relining / in-repair conflicts */
function buildLadleSchedule() {
  const bof = D.schedule.durations.BOF;
  return D.schedule.heats.map(hd => {
    const use = (hd.no === 'H2601' && assignedLadle) ? assignedLadle : hd.ladle;
    const l = D.ladles.find(x => x.id === use) || { id: use, heatsLeft: 30, lining: 'OK', status: 'available' };
    const inRepair = l.status === 'repair' || l.lining === 'Relining';
    const near = l.heatsLeft <= 5 || (l.lining && l.lining !== 'OK');
    const conflict = inRepair || near;
    const reason = inRepair ? (use + ' is in relining (0 heats left) — re-assign this heat to an available ladle')
      : near ? (use + ' near relining limit — ' + l.heatsLeft + ' heats left, lining ' + String(l.lining || '').toLowerCase() + '. Re-assign heat + route ladle to reline.')
      : null;
    return { ladle: use, heat: hd.no, grade: hd.grade, mins: hd.start + bof, tap: fmtT(hd.start + bof), ret: conflict ? '→ relining bay' : (fmtT(hd.start + bof + 85) + ' (85 min)'), heatsLeft: l.heatsLeft, conflict, reason };
  }).sort((a, b) => a.mins - b.mins);
}
function renderRolling() {
  const wrap = h('div', {});
  const coils = rollingProgram();
  wrap.appendChild(MESC.card({
    title: 'HSM-2 Rolling Schedule', icon: 'fa-scroll',
    right: coils.length + ' coils · rolling program',
    body: [
      h('div', { class: 'hint mb-8' }, [MESC.icon('fa-arrow-right-long'), ' Cast slabs are rolled at HSM-2 into hot-rolled coils. The rolling program sequences coils by grade campaign, then finish gauge (minimise gauge / hardness steps for work-roll wear); hot-charged slabs feed the RHF charging table directly from the caster.']),
      MESC.table([
        { label: '#', render: (r, i) => String(i + 1) },
        { label: 'Coil', render: r => h('span', { class: 'mono strong' }, [r.ref]) },
        { label: 'From slab', render: r => h('span', { class: 'mono hint' }, [r.slab]) },
        { label: 'Grade', render: r => r.grade },
        { label: 'Width', render: r => r.width + ' mm' },
        { label: 'Finish gauge', render: r => h('span', { class: 'strong' }, [r.gauge.toFixed(2) + ' mm']) },
        { label: 'Reheat', render: r => h('span', { class: 'mono' }, [r.reheat + ' °C']) },
        { label: 'Charge', render: r => r.charge === 'Hot' ? MESC.badge('Hot Charge', 'warning', 'fa-fire') : MESC.badge('Cold', 'neutral', 'fa-snowflake') },
        { label: 'Coil wt', num: true, render: r => r.wt + ' MT' },
        { label: 'Status', render: () => MESC.badge('Scheduled', 'info') }
      ], coils)
    ]
  }));
  const rLanes = ['RHF1', 'Roughing Mill', 'Finishing Mill', 'Down Coiler'];
  const rg = MESC.gantt(rLanes, rollingBars(coils), { pxPerMin: 8, totalMin: 150, tickMin: 60 });
  wrap.appendChild(MESC.card({ title: 'HSM-2 Mill — Rolling Time Plan', icon: 'fa-chart-gantt', right: 'reheat → rough → finish → coil · ~6 min/coil cadence', tight: true, body: [h('div', { style: 'padding:10px' }, [rg, rollLegend(),
    h('div', { class: 'hint mt-8' }, [MESC.icon('fa-fire'), ' RHF1 is a continuous walking-beam reheat furnace — several slabs soak in parallel (~45 min each, charged about 6 min apart), so those bars overlap by design. The roughing, finishing and down-coiler stands downstream each roll one piece at a time, so their bars are sequential.'])])] }));
  return wrap;
}
function rollingProgram() {
  const order = ['IS 2062 E250', 'IS 2062 E350', 'SAILMA 350', 'API 5L X60'];
  const gauges = { 'IS 2062 E250': [5.00, 3.00, 2.50], 'IS 2062 E350': [6.00, 4.00, 3.00], 'SAILMA 350': [5.00, 4.00, 3.00], 'API 5L X60': [6.35, 5.00, 4.00] };
  const coils = [];
  order.forEach(grade => {
    D.schedule.heats.filter(hh => hh.grade === grade).forEach((hh, gi) => {
      const g = (gauges[grade] || [])[gi] || 3.00;
      coils.push({ ref: 'C' + hh.no.slice(1), slab: 'ISWCC' + hh.ccm.slice(-1) + hh.no + 'S001', grade: grade, width: D.schedule.slab.width, gauge: g, reheat: 1180 + Math.round((6 - g) * 12), charge: hh.hotCharge ? 'Hot' : 'Cold', wt: (hh.tonnage / 6 - 1.2).toFixed(1) });
    });
  });
  return coils;
}
function rollingBars(coils) {
  const bars = []; const pace = 6, soak = 45, rough = 4, fin = 4, coilD = 3, gap = 1;
  coils.forEach((cl, i) => {
    const roll = i * pace + soak;
    bars.push({ lane: 'RHF1', start: i * pace, dur: soak, label: '', cls: 'g-rhf', title: cl.ref + ' reheat ' + cl.reheat + ' °C (~' + soak + ' min soak)' });
    bars.push({ lane: 'Roughing Mill', start: roll, dur: rough, label: cl.ref, cls: 'g-rough', title: cl.ref + ' roughing' });
    bars.push({ lane: 'Finishing Mill', start: roll + rough + gap, dur: fin, label: cl.ref, cls: 'g-fin', title: cl.ref + ' finishing → ' + cl.gauge + ' mm' });
    bars.push({ lane: 'Down Coiler', start: roll + rough + gap + fin + gap, dur: coilD, label: cl.ref, cls: 'g-coiler', title: cl.ref + ' coiled ' + cl.wt + ' MT' });
  });
  return bars;
}
function rollLegend() {
  const lg = (c, t) => h('span', { class: 'row gap-4' }, [h('span', { class: 'gantt-bar ' + c, style: 'position:static;width:16px;height:12px;padding:0' }), t]);
  return h('div', { class: 'row gap-16 mt-8 hint wrap' }, [lg('g-rhf', 'RHF reheat (soak)'), lg('g-rough', 'Roughing'), lg('g-fin', 'Finishing'), lg('g-coiler', 'Down Coiler')]);
}
function legend() {
  return h('div', { class: 'row gap-16 mt-8 hint wrap' }, [
    lg('g-bof', 'BOF'), lg('g-lhf', 'LHF'), lg('g-rh', 'RH'), lg('g-ccm', 'CCM continuous cast'), lg('setup', 'grade-change setup'), lg('buffer', 'buffer')
  ]);
  function lg(c, t) { return h('span', { class: 'row gap-4' }, [h('span', { class: 'gantt-bar ' + c, style: 'position:static;width:16px;height:12px;padding:0' }), t]); }
}
