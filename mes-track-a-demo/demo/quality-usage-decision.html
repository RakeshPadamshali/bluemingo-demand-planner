<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Usage Decision — Bluemingo MES</title>
<link href="assets/vendor/roboto/roboto.css" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="assets/mes-styles.css">
<style>
  /* Usage Decision — screen-specific styles (re-homed from the QA Quality module under the demo shell) */
  .b-pass{background:rgba(76,175,80,.12);color:#388e3c;}
  .b-fail{background:rgba(244,67,54,.12);color:#d32f2f;}
  .b-pend{background:rgba(255,152,0,.12);color:#ef6c00;}
  .b-hold{background:rgba(244,67,54,.12);color:#c62828;}
  .b-clr{background:rgba(103,58,183,.12);color:#673ab7;}
  .b-info{background:rgba(33,150,243,.12);color:#1976d2;}
  .b-warn{background:rgba(245,124,0,.14);color:#ef6c00;}

  .ud-wrap{display:grid;grid-template-columns:300px 1fr;gap:12px;height:calc(100vh - 152px);min-height:440px;}
  .ud-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .lhead{padding:12px;border-bottom:1px solid var(--color-border-light);}
  .lhead .lh-title{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--color-text-muted);font-weight:600;margin-bottom:6px;}
  .lsearch{position:relative;}
  .lsearch i{position:absolute;left:10px;top:9px;color:var(--color-text-hint);font-size:11px;}
  .lsearch input{width:100%;padding:7px 10px 7px 28px;border:1px solid #ddd;border-radius:var(--radius-sm);font-size:12px;font-family:inherit;}
  .lsearch input:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(var(--color-primary-rgb),.15);}
  .litems{overflow-y:auto;flex:1;}
  .litem{padding:9px 12px;border-bottom:1px solid #f3f3f3;cursor:pointer;border-left:3px solid transparent;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .litem:hover{background:#eef7fc;}
  .litem.sel{background:var(--color-primary-light);border-left-color:var(--color-primary);}
  .litem .lh{font-weight:600;font-size:12px;font-variant-numeric:tabular-nums;}
  .litem .lg{font-size:11px;color:var(--color-text-muted);}
  .ud-detail{min-width:0;}
  .dhead{padding:12px 16px;border-bottom:1px solid var(--color-border-light);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .dh-title{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .dh-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chips .chip{font-size:12px;color:var(--color-text-secondary);background:var(--color-bg-alt);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:3px 8px;}
  .chips .chip b{color:var(--color-text-primary);font-weight:600;margin-left:3px;}
  .dbody{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px;}
  .sec-title{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--color-text-muted);font-weight:600;margin-bottom:8px;}
  .agg-table{width:100%;border-collapse:collapse;font-size:12px;border:1px solid var(--color-border-light);border-radius:var(--radius-sm);overflow:hidden;}
  .agg-table th{background:#f0f4f7;text-align:left;font-size:11px;text-transform:uppercase;color:var(--color-text-muted);font-weight:600;padding:8px 10px;}
  .agg-table td{padding:8px 10px;border-top:1px solid #f3f3f3;}
  .agg-row{cursor:pointer;}
  .agg-row:hover td{background:#eef7fc;}
  .agg-row .dim{font-weight:600;}
  .agg-detail td{background:#fafbfc;}
  .rec{display:inline-flex;gap:6px;align-items:center;margin-right:14px;font-variant-numeric:tabular-nums;}
  .defects{display:flex;flex-direction:column;gap:6px;}
  .evi-tbl{width:100%;border-collapse:collapse;font-size:12px;}
  .evi-tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--color-text-muted);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--color-border);}
  .evi-tbl td{padding:5px 8px;border-bottom:1px solid #f3f3f3;}
  .evi-tbl td.mono{font-family:monospace;font-size:12px;}
  .evi-read{color:var(--color-text-secondary);font-variant-numeric:tabular-nums;}
  .evi-empty{color:#888;font-style:italic;text-align:center;padding:10px;}
  .wf-wrap{margin-top:10px;background:var(--color-bg-alt);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:10px 12px;}
  .wf-label{font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--color-text-muted);font-weight:600;margin-bottom:8px;}
  .wf-label b{color:var(--color-primary-dark);text-transform:none;letter-spacing:0;}
  .wf{display:flex;align-items:center;flex-wrap:wrap;gap:4px;}
  .wf-step{font-size:12px;padding:4px 10px;border-radius:999px;background:#fff;border:1px solid var(--color-border);color:var(--color-text-muted);white-space:nowrap;}
  .wf-step.done{background:rgba(56,142,60,.12);border-color:rgba(56,142,60,.3);color:#388e3c;}
  .wf-step.cur{background:var(--color-primary);border-color:var(--color-primary);color:#fff;font-weight:600;}
  .wf-arr{color:#bbb;font-size:11px;}
  .def{display:flex;align-items:center;gap:8px;font-size:12px;padding:7px 10px;background:#ffebee;border:1px solid #ef9a9a;border-radius:var(--radius-sm);}
  .def i{color:var(--color-danger);}
  .dec-seg{display:inline-flex;border:1px solid var(--color-border);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:12px;flex-wrap:wrap;}
  .dec-seg button{padding:9px 18px;border:none;background:#fff;font:500 12px 'Roboto',sans-serif;color:var(--color-text-secondary);border-right:1px solid var(--color-border);}
  .dec-seg button:last-child{border-right:none;}
  .dec-seg button:hover{background:var(--color-bg-alt);}
  .dec-seg button.on.d-ACCEPT{background:var(--color-success);color:#fff;}
  .dec-seg button.on.d-DOWNGRADE{background:var(--color-warning);color:#fff;}
  .dec-seg button.on.d-AUD{background:var(--color-info);color:#fff;}
  .dec-seg button.on.d-REJECT{background:var(--color-danger);color:#fff;}
  .dec-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .fld label{display:block;font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-bottom:4px;}
  .fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:var(--radius-sm);font-size:12px;font-family:inherit;}
  .fld select:focus,.fld textarea:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(var(--color-primary-rgb),.15);}
  .fld textarea{resize:vertical;min-height:54px;}
  .fld.full{grid-column:1/-1;}
  .ud-sum{background:var(--color-bg-alt);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px 16px;}
  .ud-sum .row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:6px;font-size:12px;align-items:center;}
  .ud-sum .k{color:var(--color-text-muted);}
  .ud-sum .v{font-weight:500;}
  .dfoot{padding:12px 16px;border-top:1px solid var(--color-border-light);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .appr{font-size:12px;color:var(--color-text-muted);}
  .appr.warn{color:#ef6c00;}
  .foot-actions{display:flex;gap:8px;}
  .auto-tag{font-size:11px;color:var(--color-primary-dark);background:var(--color-primary-light);border:1px solid #b3e5fc;border-radius:var(--radius-sm);padding:2px 8px;font-weight:600;}
  @media (max-width:820px){ .ud-wrap{grid-template-columns:1fr;height:auto;} }
</style>
</head>
<body>
<script src="assets/mes-data.js"></script>
<script src="assets/mes-shell.js"></script>
<script src="assets/mes-components.js"></script>
<script>
const D = MES_DATA;
const { body, actions } = MESShell.mount({ active: 'q-ud', title: 'Usage Decision', crumb: ['Quality', 'Usage Decision'] });

/* open the Salvage & NCR screen straight into its Raise-NCR entry (deep-link handoff via sessionStorage) */
function raiseSalvage(ctx){
  try{ sessionStorage.setItem('mes_raise_ncr', JSON.stringify(Object.assign({t:Date.now()}, ctx||{}))); }catch(e){}
  try{ if(window.parent&&window.parent!==window&&window.parent.MESHost&&window.parent.MESHost.open){ window.parent.MESHost.open('q-salvage'); return; } }catch(e){}
  location.href='quality-salvage.html';
}

body.innerHTML = `
  <div class="ud-wrap">
    <div class="ud-card">
      <div class="lhead">
        <div class="lh-title">Batches — awaiting / recent usage decision (Shift B)</div>
        <div class="lsearch"><i class="fa-solid fa-magnifying-glass"></i><input id="search" placeholder="Heat / slab / coil / order…"></div>
      </div>
      <div class="litems" id="list"></div>
    </div>
    <div class="ud-card ud-detail" id="detail"></div>
  </div>`;

/* ===== decision vocabulary (steel) ===== */
const DEC_LABEL = { ACCEPT:'Accept', DOWNGRADE:'Downgrade', AUD:'Concession (AUD)', REJECT:'Reject' };
const DEC_DEFAULT = {
  ACCEPT:   { type:'Standard',         reason:'All parameters within spec / TDC',        action:'Release to next process',          status:'OK' },
  DOWNGRADE:{ type:'Downgrade',        reason:'Surface / dimension deviation — re-grade', action:'Downgrade & re-allocate order',     status:'DOWNGRADED' },
  AUD:      { type:'Concession (AUD)', reason:'Minor deviation accepted under concession',action:'Release under concession (AUD)',    status:'OK' },
  REJECT:   { type:'Standard',         reason:'Critical / out-of-spec non-conformance',   action:'Reject / Scrap',                   status:'REJECTED' }
};
const UD_TYPES   = ['Standard','Downgrade','Concession (AUD)'];
const UD_REASONS = ['All parameters within spec / TDC','Mechanical & surface within spec','Minor deviation accepted under concession','Surface / dimension deviation — re-grade','Chemistry out of specification','Mechanical properties below spec','Pending customer approval','Critical / out-of-spec non-conformance'];
const UD_ACTIONS = ['Release to next process','Release / Dispatch to customer','Release under concession (AUD)','Downgrade & re-allocate order','Reroute to alternate order','Hold for review','Reject / Scrap'];
const MAT_STATUS = ['OK','HOLD','DOWNGRADED','REJECTED','QUARANTINE'];

/* ===== worklist — Integrated Works heats / slabs / coils (current shift) =====
   dims per batch: Chemistry + Mechanical (lab tests) and Surface + Dimensional (inspections).
   The tracked coil C2601 carries an auto quality decision (lab mechanical + online surface). */
const LOTS = [
  { id:D.coil.id, kind:'Coil', ref:D.coil.ref, grade:D.coil.grade, tdc:'TDC-E250', order:D.order.no, qty:D.coil.wt+' MT',
    mech:{ ys:D.coil.ys, uts:D.coil.uts, elong:D.coil.elong }, surfaceAuto:false,
    clr:{ Chemistry:{r:'CLEARED',op:'SMS-2 · LHF',recs:[['CHM-H2601-LF-05','PASS']]},
          Mechanical:{r:'CLEARED',op:'HSM-2 · Test House',recs:[['TST-C2601-TEN-01','PASS']]},
          Surface:{r:'PENDING',op:'HSM-2 · Surface SIS',recs:[]},
          Dimensional:{r:'CLEARED',op:'HSM-2 · Profile Gauge',recs:[['DIM-C2601-01','PASS']]} },
    defects:[], mstatus:'Pending QC', ud:null },

  { id:'ISWHSM2C2604002', kind:'Coil', ref:'C2604', grade:'IS 2062 E250', tdc:'TDC-E250', order:D.order.no, qty:'24.6 MT',
    clr:{ Chemistry:{r:'CLEARED',op:'SMS-2 · LHF',recs:[['CHM-H2604-LF-03','PASS']]},
          Mechanical:{r:'CLEARED',op:'HSM-2 · Test House',recs:[['TST-C2604-TEN-01','PASS']]},
          Surface:{r:'CLEARED',op:'HSM-2 · Surface SIS',recs:[['SIS-C2604-01','COND']]},
          Dimensional:{r:'CLEARED',op:'HSM-2 · Profile Gauge',recs:[['DIM-C2604-01','PASS']]} },
    defects:[['Edge crack (minor)','Isolated edge defect within trim allowance','MINOR']], mstatus:'HOLD', ud:null },

  { id:'ISWCC1H2604S003', kind:'Slab', ref:'S2604-03', grade:'IS 2062 E250', tdc:'TDC-E250', order:D.order.no, qty:'26.1 MT',
    clr:{ Chemistry:{r:'CLEARED',op:'SMS-2 · Tundish',recs:[['CHM-H2604-TD-01','PASS']]},
          Mechanical:{r:'FAIL',op:'HSM-2 · Test House',recs:[['TST-S2604-03','FAIL']]},
          Surface:{r:'CLEARED',op:'CCM · Scarfing',recs:[['SIS-S2604-03','PASS']]},
          Dimensional:{r:'CLEARED',op:'CCM · Slab Gauge',recs:[['DIM-S2604-03','PASS']]} },
    defects:[['Yield below spec','YS 232 MPa vs 250 min after roughing','MAJOR']], mstatus:'HOLD', ud:null },

  { id:'H2605', kind:'Heat', ref:'H2605', grade:'API 5L X60', tdc:'TDC-X60', order:'SO-2026-04490', qty:'165 MT',
    clr:{ Chemistry:{r:'FAIL',op:'SMS-2 · BOF3',recs:[['CHM-H2605-BOF-01','FAIL']]},
          Mechanical:{r:'PENDING',op:'HSM-2 · Test House',recs:[]},
          Surface:{r:'PENDING',op:'HSM-2 · Surface SIS',recs:[]},
          Dimensional:{r:'PENDING',op:'HSM-2 · Profile Gauge',recs:[]} },
    defects:[['Chemistry out of spec','S 0.021% vs 0.015% max (X60)','MAJOR']], mstatus:'HOLD', ud:null },

  { id:'ISWCC1H2601S002', kind:'Slab', ref:'S2601-02', grade:'IS 2062 E250', tdc:'TDC-E250', order:D.order.no, qty:'24.8 MT',
    clr:{ Chemistry:{r:'CLEARED',op:'SMS-2 · Tundish',recs:[['CHM-H2601-TD-01','PASS']]},
          Mechanical:{r:'CLEARED',op:'HSM-2 · Test House',recs:[['TST-S2601-02','PASS']]},
          Surface:{r:'CLEARED',op:'CCM · Scarfing',recs:[['SIS-S2601-02','PASS']]},
          Dimensional:{r:'CLEARED',op:'CCM · Slab Gauge',recs:[['DIM-S2601-02','PASS']]} },
    defects:[], mstatus:'OK', ud:null },

  { id:'ISWHSM2C2603001', kind:'Coil', ref:'C2603', grade:'SAILMA 350', tdc:'TDC-SLM350', order:'SO-2026-04488', qty:'23.4 MT',
    clr:{ Chemistry:{r:'CLEARED',op:'SMS-2 · LHF',recs:[['CHM-H2603-LF-04','PASS']]},
          Mechanical:{r:'CLEARED',op:'HSM-2 · Test House',recs:[['TST-C2603-TEN-01','PASS']]},
          Surface:{r:'CLEARED',op:'HSM-2 · Surface SIS',recs:[['SIS-C2603-01','PASS']]},
          Dimensional:{r:'CLEARED',op:'HSM-2 · Profile Gauge',recs:[['DIM-C2603-01','COND']]} },
    defects:[['Thickness on lower limit','2.42 mm vs 2.50 mm nominal','MINOR']], mstatus:'OK', ud:null }
];

const M = { READY:'b-pass', REVIEW:'b-warn', INCOMPLETE:'b-pend',
  ACCEPT:'b-pass', DOWNGRADE:'b-warn', AUD:'b-info', REJECT:'b-fail',
  OK:'b-pass', HOLD:'b-hold', DOWNGRADED:'b-warn', REJECTED:'b-fail', QUARANTINE:'b-hold', 'QC Released':'b-clr', 'Pending QC':'b-pend',
  APPROVED:'b-pass', PENDING:'b-pend', CLEARED:'b-pass', FAIL:'b-fail', PASS:'b-pass', COND:'b-info' };
function bdg(s){ return `<span class="badge ${M[s]||'b-pend'}">${s}</span>`; }
function opts(list,sel){ return list.map(o=>`<option ${o===sel?'selected':''}>${o}</option>`).join(''); }

/* evidence: lab test readings (Chemistry/Mechanical) + inspections (Surface/Dimensional), derived from the batch clearances */
const READINGS = {
  'TST-C2601-TEN-01':'YS 285 · UTS 420 · Elong 27% · Bend OK',
  'TST-C2604-TEN-01':'YS 278 · UTS 415 · Elong 26%',
  'TST-S2604-03':'YS 232 · UTS 402 · Elong 21% ✗',
  'TST-S2601-02':'YS 292 · UTS 431 · Elong 28%',
  'TST-C2603-TEN-01':'YS 372 · UTS 512 · Elong 22%',
  'CHM-H2601-LF-05':'C .061 · Mn 1.20 · S .005 · P .018 · Si .18',
  'CHM-H2604-LF-03':'C .066 · Mn 1.24 · S .007 · P .019 · Si .19',
  'CHM-H2604-TD-01':'C .065 · Mn 1.23 · S .008 · P .020 · Si .19',
  'CHM-H2605-BOF-01':'C .14 · Mn 1.42 · S .021 · Nb .03 ✗',
  'CHM-H2601-TD-01':'C .060 · Mn 1.19 · S .006 · P .018 · Si .18'
};
function inspectionsOf(lot){ const out=[]; Object.entries(lot.clr).forEach(([dim,c])=>{ if(dim==='Surface'||dim==='Dimensional') c.recs.forEach(r=>out.push({no:r[0],type:dim==='Surface'?'Surface (Surface SIS)':'Dimensional / Profile',stage:c.op,result:r[1]})); }); return out; }
function testsOf(lot){ const out=[]; Object.entries(lot.clr).forEach(([dim,c])=>{ if(dim==='Chemistry'||dim==='Mechanical') c.recs.forEach(r=>out.push({no:r[0],test:dim==='Chemistry'?'Chemical (Spectro)':'Mechanical (Tensile)',readings:READINGS[r[0]]||'—',result:r[1]})); }); return out; }

/* workflow triggered by the chosen UD action */
const WORKFLOW = {
  'Release to next process':['Record UD','QC approval','Release → next process'],
  'Release / Dispatch to customer':['Record UD','QC Head approval','TC generated','Release → dispatch'],
  'Release under concession (AUD)':['Record AUD','Shift Manager review','QC Head approval','Release (concession)'],
  'Downgrade & re-allocate order':['Record UD','Re-grade material','Re-allocate order','Re-inspect'],
  'Reroute to alternate order':['Record UD','Reroute approval','Re-allocate order','Re-inspect'],
  'Hold for review':['Record UD','Material on hold','Await review'],
  'Reject / Scrap':['Record UD','Raise NCR','Quarantine','Scrap']
};
function isSalvage(a){ return a==='Downgrade & re-allocate order'||a==='Reroute to alternate order'; }
function wfSteps(action,done){ const steps=WORKFLOW[action]||['Record UD']; return '<div class="wf">'+steps.map((s,i)=>`<span class="wf-step ${i<done?'done':i===done?'cur':''}">${i+1}. ${s}</span>`).join('<i class="fa-solid fa-angle-right wf-arr"></i>')+'</div>'; }

let curIdx=0, form={};
const cur=()=>LOTS[curIdx];
const dims=lot=>Object.entries(lot.clr);
function pendingCount(lot){ return Object.values(lot.clr).filter(c=>c.r==='PENDING').length; }
function canDecide(lot){ return pendingCount(lot)===0; }
function suggest(lot){ const vs=Object.values(lot.clr).map(c=>c.r); return vs.includes('FAIL')?'REJECT':'ACCEPT'; }
function readiness(lot){ if(lot.ud)return lot.ud.decision; const vs=Object.values(lot.clr).map(c=>c.r); if(vs.includes('FAIL'))return'REVIEW'; if(vs.includes('PENDING'))return'INCOMPLETE'; return'READY'; }
function initForm(){ const d=suggest(cur()); form=Object.assign({decision:d,remarks:'',salvageRemarks:''},DEC_DEFAULT[d]); }

function renderList(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  document.getElementById('list').innerHTML=LOTS.map((l,i)=>{
    if(q&&!(l.id+' '+l.ref+' '+l.order+' '+l.grade+' '+l.kind).toLowerCase().includes(q))return'';
    const rd=readiness(l);
    return `<div class="litem ${i===curIdx?'sel':''}" onclick="sel(${i})">
      <div><div class="lh">${l.id}</div><div class="lg">${l.kind} · ${l.grade} · ${l.ref}</div></div>
      <span class="badge ${M[rd]||'b-pend'}">${rd}</span></div>`;
  }).join('');
}
function sel(i){ curIdx=i; initForm(); renderList(); renderDetail(); }
function toggleDet(i){ const e=document.getElementById('det-'+i); if(!e)return; e.hidden=!e.hidden; const c=document.getElementById('chev-'+i); if(c)c.style.transform=e.hidden?'':'rotate(180deg)'; }

function renderDetail(){
  const lot=cur();
  const chips=[['Type',lot.kind],['Grade',lot.grade],['TDC',lot.tdc],['Order',lot.order],['Qty',lot.qty]]
    .map(p=>`<span class="chip">${p[0]}<b>${p[1]}</b></span>`).join('')+`<span class="chip">Material status<b> ${lot.mstatus}</b></span>`;

  const acts=[];
  if(lot.mech && !lot.ud) acts.push(`<button class="btn btn-primary btn-sm" onclick="autoDecision()"><i class="fa-solid fa-robot"></i> Run auto quality decision</button>`);
  if(!lot.ud) acts.push(`<button class="btn btn-ghost btn-sm" onclick="raiseAUD()"><i class="fa-solid fa-file-signature"></i> Acceptance Under Deviation</button>`);
  acts.push(`<button class="btn btn-outline btn-sm" onclick="raiseSalvage({uid:'${lot.id}',grade:'${lot.grade}',ref:'${lot.ref}',stage:'${lot.kind==='Slab'?'CCM Casting':'HSM-2 Finishing'}',src:'Usage Decision'})"><i class="fa-solid fa-screwdriver-wrench"></i> Raise Salvage / NCR</button>`);
  const actionsHtml=acts.join('');

  const aggRows=dims(lot).map(([name,c],i)=>`
    <tr class="agg-row" onclick="toggleDet(${i})"><td class="dim">${name}</td><td>${c.op}</td><td>${c.recs.length} record(s)</td><td>${bdg(c.r)}</td><td style="text-align:right"><i class="fa-solid fa-chevron-down" id="chev-${i}" style="font-size:10px;color:#999;transition:.15s"></i></td></tr>
    <tr class="agg-detail" id="det-${i}" hidden><td colspan="5">${c.recs.length?c.recs.map(r=>`<span class="rec"><b>${r[0]}</b> ${bdg(r[1])}</span>`).join(''):'<span style="color:#888;font-style:italic">No record yet — clearance pending.</span>'}</td></tr>`).join('');

  const relSec=lot.mech?`<section><div class="sec-title">Mechanical &amp; surface — coil release check</div>
    <table class="evi-tbl"><thead><tr><th>Property</th><th>Measured</th><th>Spec</th><th>Source</th><th>Result</th></tr></thead><tbody>
      <tr><td>Yield strength (YS)</td><td class="evi-read">${lot.mech.ys} MPa</td><td class="evi-read">≥ 250 MPa</td><td>Test House</td><td>${bdg(lot.mech.ys>=250?'PASS':'FAIL')}</td></tr>
      <tr><td>Tensile strength (UTS)</td><td class="evi-read">${lot.mech.uts} MPa</td><td class="evi-read">410–510 MPa</td><td>Test House</td><td>${bdg(lot.mech.uts>=410&&lot.mech.uts<=510?'PASS':'FAIL')}</td></tr>
      <tr><td>Elongation</td><td class="evi-read">${lot.mech.elong}%</td><td class="evi-read">≥ 23%</td><td>Test House</td><td>${bdg(lot.mech.elong>=23?'PASS':'FAIL')}</td></tr>
      <tr><td>Surface</td><td class="evi-read">${lot.surfaceAuto?'No critical defect — online scan':'Awaiting online scan'}</td><td class="evi-read">No critical defect</td><td>${lot.surfaceAuto?'<span class="auto-tag">AUTO · Surface SIS</span>':'Surface SIS'}</td><td>${bdg(lot.surfaceAuto?'PASS':'PENDING')}</td></tr>
    </tbody></table></section>`:'';

  const defSec=lot.defects.length?`<section><div class="sec-title">Open defects / deviations</div><div class="defects">${lot.defects.map(d=>`<div class="def"><i class="fa-solid fa-triangle-exclamation"></i> <b>${d[0]}</b> — ${d[1]} <span class="badge ${d[2]==='MINOR'?'b-warn':'b-fail'}" style="margin-left:auto">${d[2]}</span></div>`).join('')}</div></section>`:'';

  const insp=inspectionsOf(lot), tests=testsOf(lot);
  const inspSec=`<section><div class="sec-title">Surface &amp; dimensional inspections</div>
    <table class="evi-tbl"><thead><tr><th>QC No</th><th>Type</th><th>Stage</th><th>Result</th></tr></thead><tbody>${insp.length?insp.map(x=>`<tr><td class="mono">${x.no}</td><td>${x.type}</td><td>${x.stage}</td><td>${bdg(x.result)}</td></tr>`).join(''):'<tr><td colspan="4" class="evi-empty">No inspections recorded yet.</td></tr>'}</tbody></table></section>`;
  const testSec=`<section><div class="sec-title">Lab test results</div>
    <table class="evi-tbl"><thead><tr><th>Test No</th><th>Test</th><th>Readings</th><th>Result</th></tr></thead><tbody>${tests.length?tests.map(x=>`<tr><td class="mono">${x.no}</td><td>${x.test}</td><td class="evi-read">${x.readings}</td><td>${bdg(x.result)}</td></tr>`).join(''):'<tr><td colspan="4" class="evi-empty">No tests recorded yet.</td></tr>'}</tbody></table></section>`;

  let decSec, foot;
  if(lot.ud){
    const u=lot.ud;
    decSec=`<section><div class="sec-title">Usage Decision — recorded</div>
      <div class="ud-sum">
        <div class="row"><span class="v">${bdg(u.decision)}</span> <span class="auto-tag">${u.auto?'AUTO-UD':u.aud?'AUD · CONCESSION':'MANUAL'}</span></div>
        <div class="row"><span><span class="k">Type:</span> <span class="v">${u.type}</span></span><span><span class="k">Action:</span> <span class="v">${u.action}</span></span><span><span class="k">Material status:</span> ${bdg(u.status)}</span></div>
        <div class="row"><span class="k">Reason:</span> <span class="v">${u.reason}</span></div>
        ${u.remarks?`<div class="row"><span class="k">${u.aud?'Justification:':'Remarks:'}</span> <span class="v">${u.remarks}</span></div>`:''}
        ${u.salvageRemarks?`<div class="row"><span class="k">Re-grade / reroute:</span> <span class="v">${u.salvageRemarks}</span></div>`:''}
        ${u.chain?`<div class="row"><span class="k">Approval chain:</span> <span class="v">${u.chain}</span></div>`:''}
        <div class="row"><span class="k">Decided by:</span> <span class="v">QC · just now</span> <span class="k">Approval:</span> ${bdg(u.approval)}</div>
      </div>
      <div class="wf-wrap"><div class="wf-label"><i class="fa-solid fa-diagram-project"></i> Workflow — <b>${u.action}</b></div>${wfSteps(u.action,u.approval==='APPROVED'?(WORKFLOW[u.action]||[]).length-1:1)}</div>
      </section>`;
    foot=`<div class="appr">${u.approval==='PENDING'?'Recorded — awaiting QC Head approval.':'Approved — material released per action.'}</div>
      <div class="foot-actions"><button class="btn btn-ghost" onclick="reviseUD()"><i class="fa-solid fa-pen"></i> Revise</button>
      ${u.approval==='PENDING'?'<button class="btn btn-success" onclick="approve()"><i class="fa-solid fa-check-double"></i> Approve</button>':''}</div>`;
  } else {
    decSec=`<section><div class="sec-title">Usage Decision <span class="auto-tag" style="margin-left:6px">Suggested: ${DEC_LABEL[suggest(lot)]}</span></div>
      <div class="dec-seg">${['ACCEPT','DOWNGRADE','AUD','REJECT'].map(d=>`<button class="d-${d} ${form.decision===d?'on':''}" onclick="setDecision('${d}')">${DEC_LABEL[d]}</button>`).join('')}</div>
      <div class="dec-grid">
        <div class="fld"><label>UD Type</label><select onchange="setF('type',this.value)">${opts(UD_TYPES,form.type)}</select></div>
        <div class="fld"><label>Action</label><select onchange="setF('action',this.value)">${opts(UD_ACTIONS,form.action)}</select></div>
        <div class="fld"><label>Reason</label><select onchange="setF('reason',this.value)">${opts(UD_REASONS,form.reason)}</select></div>
        <div class="fld"><label>Resulting material status</label><select onchange="setF('status',this.value)">${opts(MAT_STATUS,form.status)}</select></div>
        ${isSalvage(form.action)?`<div class="fld full"><label>Re-grade / reroute remarks <span style="color:#888;font-weight:400;font-size:11px">(downgrade grade · alternate order · loss est.)</span></label><textarea oninput="form.salvageRemarks=this.value" placeholder="Downgrade grade, alternate order, expected loss…">${form.salvageRemarks||''}</textarea></div>`:''}
        <div class="fld full"><label>UD Remarks</label><textarea oninput="form.remarks=this.value" placeholder="Decision rationale, concession ref, customer note…">${form.remarks}</textarea></div>
      </div>
      <div class="wf-wrap"><div class="wf-label"><i class="fa-solid fa-diagram-project"></i> Workflow on action — <b>${form.action}</b></div>${wfSteps(form.action,0)}</div>
      </section>`;
    const ok=canDecide(lot);
    foot=`<div class="appr ${ok?'':'warn'}">${ok?'Recording captures the decision and routes for approval (Quality → QC Head).':`Awaiting ${pendingCount(lot)} clearance(s) — complete or run auto decision before UD.`}</div>
      <button class="btn btn-primary" onclick="recordUD()" ${ok?'':'disabled'}><i class="fa-solid fa-gavel"></i> Record Usage Decision</button>`;
  }

  document.getElementById('detail').innerHTML=`
    <div class="dhead">
      <div><div class="dh-title">${lot.kind} ${lot.ref} <span class="badge ${M[readiness(lot)]||'b-pend'}">${readiness(lot)}</span></div>
        <div class="chips">${chips}</div></div>
      <div class="dh-actions">${actionsHtml}</div>
    </div>
    <div class="dbody">
      <section><div class="sec-title">Clearance summary — by dimension</div>
        <table class="agg-table"><thead><tr><th>Dimension</th><th>Stage</th><th>Records</th><th>Result</th><th></th></tr></thead><tbody>${aggRows}</tbody></table>
      </section>
      ${relSec}
      ${inspSec}
      ${testSec}
      ${defSec}
      ${decSec}
    </div>
    <div class="dfoot">${foot}</div>`;
}
function setDecision(d){ if(d==='AUD'){ raiseAUD(); return; } form.decision=d; Object.assign(form,DEC_DEFAULT[d]); renderDetail(); }
function setF(k,v){ form[k]=v; if(k==='action')renderDetail(); }
function recordUD(){ const lot=cur(); const auto=form.decision==='ACCEPT'&&suggest(lot)==='ACCEPT';
  lot.ud=Object.assign({},form,{approval:'PENDING',auto}); lot.mstatus=form.status; renderList(); renderDetail();
  MESShell.toast('Usage decision recorded for '+lot.kind+' '+lot.ref+' — routed for QC Head approval','success'); }
function approve(){ cur().ud.approval='APPROVED'; renderList(); renderDetail(); MESShell.toast('Usage decision approved — '+cur().kind+' '+cur().ref,'success'); }
function reviseUD(){ cur().ud=null; initForm(); renderList(); renderDetail(); }
function massUD(){ MESShell.toast('Mass UD — filter batches by grade / order / readiness and apply one decision to all matching batches (demo).','info'); }

/* Coil quality decision + Surface SIS auto-release: pull the online surface result, evaluate lab mechanical vs spec,
   both PASS -> QC Released, batch attributes handed to SAP-QM. */
function autoDecision(){
  const rec=cur();
  if(!rec.mech)return;
  rec.clr.Surface={ r:'CLEARED', op:'HSM-2 · Surface SIS', recs:[['SIS-'+rec.ref+'-01','PASS']] };
  rec.surfaceAuto=true;
  const m=rec.mech;
  const mechPass = m.ys>=250 && m.uts>=410 && m.uts<=510 && m.elong>=23;
  if(mechPass){
    rec.ud={ decision:'ACCEPT', type:'Standard', reason:'Mechanical & surface within spec',
      action:'Release / Dispatch to customer', status:'QC Released',
      remarks:'Auto quality decision — lab mechanical PASS (YS '+m.ys+' / UTS '+m.uts+' / El '+m.elong+'%) and online surface PASS.',
      approval:'APPROVED', auto:true };
    rec.mstatus='QC Released';
    renderList(); renderDetail();
    MESShell.toast('Coil '+rec.ref+' QC Released — batch attributes sent to SAP-QM','success');
  } else {
    rec.mstatus='HOLD'; renderList(); renderDetail();
    MESShell.toast('Coil '+rec.ref+' held — mechanical result out of spec','danger');
  }
}

/* Acceptance Under Deviation (concession): justification + two-level approval chain, retained in audit trail. */
function raiseAUD(){
  const rec=cur();
  const ta=h('textarea',{ placeholder:'Describe the deviation and the technical justification for acceptance (fitness-for-use, customer concession ref, inspection evidence)…', rows:'4' });
  const chain=h('div',{class:'wf'},[
    h('span',{class:'wf-step cur'},['1. Shift Manager']),
    h('i',{class:'fa-solid fa-angle-right wf-arr'}),
    h('span',{class:'wf-step'},['2. QC Head'])
  ]);
  const modal=MESC.modal({
    title:'Acceptance Under Deviation — '+rec.kind+' '+rec.ref+' ('+rec.grade+')', icon:'fa-file-signature', size:'lg',
    body:[
      h('div',{class:'hint mb-8'},['Record a concession to accept material that deviates from the '+rec.grade+' specification. The concession is routed for two-level approval and retained in the audit trail.']),
      (rec.defects&&rec.defects.length)? h('div',{class:'def'},[MESC.icon('fa-triangle-exclamation'), h('b',{},[rec.defects[0][0]]), ' — '+rec.defects[0][1]]) : null,
      h('div',{class:'fld',style:'margin-top:10px'},[h('label',{},['Deviation justification']), ta]),
      h('div',{class:'wf-wrap'},[h('div',{class:'wf-label'},[MESC.icon('fa-diagram-project'),' Approval chain']), chain])
    ],
    footer:[
      h('button',{class:'btn btn-ghost',onclick:()=>modal.close()},['Cancel']),
      h('button',{class:'btn btn-primary',onclick:()=>{
        if(!ta.value.trim()){ MESShell.toast('Enter a deviation justification before submitting the AUD','warning'); return; }
        rec.ud={ decision:'AUD', type:'Concession (AUD)', reason:'Minor deviation accepted under concession',
          action:'Release under concession (AUD)', status:'OK', remarks:ta.value.trim(),
          approval:'PENDING', auto:false, aud:true, chain:'Shift Manager → QC Head' };
        rec.mstatus='OK';
        modal.close(); renderList(); renderDetail();
        MESShell.toast('AUD created; approval workflow triggered; audit trail maintained','success');
      }},[MESC.icon('fa-file-signature'),'Submit AUD'])
    ]
  });
}

actions.appendChild(h('button',{ class:'btn btn-ghost btn-sm', onclick:massUD },[ h('i',{class:'fa-solid fa-layer-group'}), ' Mass UD' ]));
document.getElementById('search').oninput=renderList;
initForm(); renderList(); renderDetail();
</script>
