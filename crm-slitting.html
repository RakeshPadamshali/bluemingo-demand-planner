<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM Slitting Pattern Report · Bluemingo MES v2</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root {
    --color-primary:#25A9E0; --color-primary-dark:#1E8FBF; --color-primary-light:#E1F5FE; --color-primary-rgb:37,169,224;
    --color-success:#388e3c; --color-success-light:#e8f5e9; --color-warning:#f57c00; --color-warning-light:#fff8e1;
    --color-danger:#d32f2f; --color-info:#2196f3; --color-info-light:#e3f2fd;
    --color-bg:#f5f5f5; --color-bg-alt:#fafafa; --color-surface:#fff; --color-border:#e0e0e0; --color-border-light:#eeeeee;
    --color-text-primary:#333; --color-text-secondary:#555; --color-text-muted:#666; --color-text-hint:#888; --header-bg:#1a1a2e; --header-bg-dark:#12121f;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; font-family:'Roboto',sans-serif; font-size:13px; color:var(--color-text-primary); background:var(--color-bg); overflow:hidden; }
  .bm-header { height:44px; background:linear-gradient(90deg,var(--header-bg),var(--header-bg-dark)); color:#fff; display:flex; align-items:center; padding:0 12px; flex-shrink:0; }
  .bm-header .logo { font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; }
  .bm-header .logo i { color:var(--color-primary); }
  .bm-header .module-name { margin-left:16px; padding-left:16px; border-left:1px solid rgba(255,255,255,.15); font-size:12px; opacity:.85; }
  .bm-header .spacer { flex:1; }
  .bm-header .industry-switch { display:flex; gap:2px; background:rgba(255,255,255,.06); padding:2px; border-radius:6px; }
  .bm-header .industry-switch button { background:transparent; color:rgba(255,255,255,.7); border:none; padding:4px 12px; font:500 11px 'Roboto'; border-radius:4px; cursor:pointer; letter-spacing:.3px; text-transform:uppercase; }
  .bm-header .industry-switch button.active { background:var(--color-primary); color:#fff; }
  .bm-header .right { display:flex; align-items:center; gap:12px; margin-left:12px; font-size:12px; }
  .bm-header .avatar { width:26px; height:26px; border-radius:50%; background:var(--color-primary); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:11px; }
  .bm-layout { display:flex; height:calc(100vh - 44px); }
  .bm-sidebar { width:180px; background:linear-gradient(180deg,#1e1e32,#16213e); color:rgba(255,255,255,.65); flex-shrink:0; padding:8px 0; overflow-y:auto; }
  .bm-sidebar .nav-label { color:#fff; font:700 10px 'Roboto'; letter-spacing:1px; text-transform:uppercase; padding:8px 14px 4px; margin-top:4px; }
  .bm-sidebar a { display:flex; align-items:center; gap:8px; color:inherit; text-decoration:none; padding:6px 14px; margin:1px 6px; border-radius:6px; font-size:12px; cursor:pointer; }
  .bm-sidebar a:hover { background:rgba(255,255,255,.08); color:#fff; }
  .bm-sidebar a.active { background:rgba(var(--color-primary-rgb),.2); color:#E1F5FE; position:relative; }
  .bm-sidebar a.active::before { content:''; position:absolute; left:0; top:4px; bottom:4px; width:2px; background:var(--color-primary); border-radius:0 2px 2px 0; }
  .bm-sidebar a i { width:14px; text-align:center; opacity:.85; font-size:11px; }
  .bm-content { flex:1; overflow-y:auto; display:flex; flex-direction:column; padding:10px 14px 24px; }
  .page-bar { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .page-bar h1 { margin:0; font-size:16px; font-weight:600; }
  .page-bar .crumb { color:var(--color-text-muted); font-size:11px; }
  .page-bar .actions { margin-left:auto; display:flex; gap:6px; }
  .btn { padding:6px 14px; border-radius:4px; border:none; font:500 12px 'Roboto'; cursor:pointer; display:inline-flex; align-items:center; gap:6px; text-decoration:none; }
  .btn-outline { background:transparent; border:1px solid var(--color-primary); color:var(--color-primary); } .btn-outline:hover { background:var(--color-primary); color:#fff; }
  .btn-primary { background:var(--color-primary); color:#fff; } .btn-primary:hover { background:var(--color-primary-dark); }
  .kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:12px; }
  @media (max-width:900px){ .kpis { grid-template-columns:repeat(2,1fr);} }
  .kpi { background:var(--color-surface); border:1px solid var(--color-border); border-radius:8px; padding:10px 12px; position:relative; overflow:hidden; }
  .kpi::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--color-primary); }
  .kpi.green::before{background:var(--color-success);} .kpi.amber::before{background:var(--color-warning);} .kpi.purple::before{background:#ab47bc;}
  .kpi .k { font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:var(--color-text-muted); font-weight:600; }
  .kpi .v { font-size:22px; font-weight:700; margin-top:3px; font-variant-numeric:tabular-nums; }
  .kpi .s { font-size:11px; color:var(--color-text-hint); margin-top:1px; }
  .card { background:var(--color-surface); border:1px solid var(--color-border); border-radius:8px; overflow:hidden; margin-bottom:12px; }
  .card-head { padding:8px 12px; background:var(--color-bg-alt); border-bottom:1px solid var(--color-border-light); font:600 12px 'Roboto'; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .card-head i { color:var(--color-primary); } .card-head .right { margin-left:auto; display:flex; align-items:center; gap:8px; font-weight:400; font-size:11px; color:var(--color-text-muted); }
  .card-body { padding:12px; }
  .chip { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:5px; font-size:10.5px; font-weight:600; background:#eef2f5; color:#455a64; }
  .yb { display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:11px; font-size:11px; font-weight:700; }
  .yb.ok { background:var(--color-success-light); color:var(--color-success); } .yb.warn { background:var(--color-warning-light); color:#b25f00; }
  /* slitting visual (shared look with the PC card) */
  .master-line { display:flex; gap:8px 20px; flex-wrap:wrap; margin-bottom:12px; }
  .master-line .m-item { display:flex; flex-direction:column; }
  .m-k { font-size:10px; text-transform:uppercase; letter-spacing:.3px; color:var(--color-text-muted); font-weight:600; }
  .m-v { font-size:13px; font-weight:600; }
  .slit-layout { display:flex; height:52px; border-radius:6px; overflow:hidden; border:1px solid var(--color-border); }
  .slit-seg { display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:600; border-right:1px solid rgba(255,255,255,.55); overflow:hidden; }
  .slit-seg:last-child { border-right:none; }
  .slit-seg.strip { background:linear-gradient(180deg,#3fb6ea,#25A9E0); }
  .slit-seg.trim { background:repeating-linear-gradient(45deg,#cfd8dc,#cfd8dc 5px,#eceff1 5px,#eceff1 10px); color:#607d8b; font-size:9px; }
  .slit-seg .sw { font-size:9px; opacity:.9; font-weight:500; }
  .slit-axis { display:flex; font-size:9.5px; color:var(--color-text-hint); margin:4px 0 14px; }
  .slit-axis .a-mid { flex:1; text-align:center; }
  .slit-cols { display:grid; grid-template-columns:1.2fr 1fr; gap:16px; }
  @media (max-width:760px){ .slit-cols { grid-template-columns:1fr; } }
  .slit-sub { font:600 10px 'Roboto'; text-transform:uppercase; letter-spacing:.3px; color:var(--color-text-muted); margin-bottom:8px; }
  .slit-bar-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:11.5px; }
  .slit-bar-row .lbl { width:44px; color:var(--color-text-secondary); }
  .slit-bar-row .track { flex:1; height:14px; background:var(--color-bg); border-radius:7px; overflow:hidden; }
  .slit-bar-row .fill { height:100%; background:linear-gradient(90deg,#3fb6ea,#25A9E0); border-radius:7px; }
  .slit-bar-row .val { width:104px; text-align:right; font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; }
  .slit-bar-row .val .t { color:var(--color-primary-dark); font-weight:700; }
  .slit-yield .big { font-size:26px; font-weight:700; color:var(--color-success); font-variant-numeric:tabular-nums; }
  .slit-yield .y-bar { height:16px; border-radius:8px; display:flex; overflow:hidden; margin:6px 0 8px; border:1px solid var(--color-border); }
  .slit-yield .y-used { background:linear-gradient(90deg,#43a047,#66bb6a); } .slit-yield .y-trim { background:#cfd8dc; }
  .slit-yield .y-legend { display:flex; justify-content:space-between; font-size:11.5px; }
  .slit-yield .y-sw { width:11px; height:11px; border-radius:2px; display:inline-block; vertical-align:-1px; margin-right:4px; }
</style>
<script src="crm-embed.js"></script>
</head>
<body>
<header class="bm-header">
  <div class="logo"><i class="fa-solid fa-industry"></i> Bluemingo MES <span style="opacity:.6;font-weight:500;">v2</span></div>
  <div class="module-name"><i class="fa-solid fa-ruler-combined" style="margin-right:4px;color:var(--color-primary);"></i>Slitting Pattern Report</div>
  <div class="spacer"></div>
  <div class="industry-switch">
    <button class="active"><i class="fa-solid fa-layer-group" style="margin-right:4px"></i>Steel · CRM</button>
    <button><i class="fa-solid fa-flask" style="margin-right:4px"></i>Process</button>
    <button><i class="fa-solid fa-gears" style="margin-right:4px"></i>Discrete</button>
  </div>
  <div class="right"><i class="fa-regular fa-bell"></i><div class="avatar">RP</div></div>
</header>
<div class="bm-layout">
  <aside class="bm-sidebar">
    <div class="nav-label">Production</div>
    <a href="production-confirmation-mockup-CRM.html"><i class="fa-solid fa-circle-check"></i>Confirmation</a>
    <a href="crm-schedule.html"><i class="fa-solid fa-calendar-days"></i>Line Schedule</a>
    <div class="nav-label">Reports</div>
    <a href="crm-gantt.html"><i class="fa-solid fa-chart-gantt"></i>Line Gantt</a>
    <a class="active"><i class="fa-solid fa-ruler-combined"></i>Slitting Patterns</a>
    <a><i class="fa-solid fa-chart-line"></i>Yield &amp; Scrap</a>
    <div class="nav-label">Inventory</div>
    <a><i class="fa-solid fa-boxes-stacked"></i>Stock</a>
    <a><i class="fa-solid fa-link"></i>Genealogy</a>
    <div class="nav-label">Quality</div>
    <a><i class="fa-solid fa-vial"></i>Inspections</a>
    <div class="nav-label">Masters</div>
    <a><i class="fa-solid fa-cogs"></i>Setup</a>
  </aside>
  <main class="bm-content">
    <div class="page-bar">
      <div>
        <h1>Slitting Pattern Report</h1>
        <div class="crumb">Reports › Slitting Patterns › <span id="crumb-ctx"></span></div>
      </div>
      <div class="actions">
        <a class="btn btn-outline" href="crm-schedule.html"><i class="fa-solid fa-calendar-days"></i> Schedule</a>
        <button class="btn btn-primary" onclick="window.print()"><i class="fa-solid fa-file-export"></i> Export</button>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div id="cards"></div>
  </main>
</div>
<script src="crm-schedule-data.js"></script>
<script>
  var S = window.CRM_SCHEDULE;
  var jobs = S.jobs.filter(function (j) { return j.slit; });
  document.getElementById('crumb-ctx').textContent = S.plant + ' · Shift ' + S.shift + ' · ' + S.date;

  function calc(j) {
    var master = j.width, edge = j.slit.edge, wt = j.qty, density = 7850;   // wt = master coil weight (t)
    // Uniform thickness + length across the coil width, so tonnage splits by width fraction.
    var strips = j.slit.strips.map(function (w, i) { return { id: 'S' + (i + 1), w: w, t: wt * w / master }; });
    var used = strips.reduce(function (a, s) { return a + s.w; }, 0);
    var trim = master - used, y = used / master * 100;
    var tOut = wt * used / master, tTrim = wt - tOut;
    var lengthM = wt * 1e9 / (master * j.crcThk * density);   // W = width·thickness·L·density  ->  L
    return { strips: strips, master: master, edge: edge, used: used, trim: trim, y: y, wt: wt, tOut: tOut, tTrim: tTrim, lengthM: lengthM };
  }

  // KPIs
  var stats = jobs.map(calc);
  var totalCoils = stats.reduce(function (a, s) { return a + s.strips.length; }, 0);
  var avgY = stats.reduce(function (a, s) { return a + s.y; }, 0) / stats.length;
  var tIn = stats.reduce(function (a, s) { return a + s.wt; }, 0);
  var tOut = stats.reduce(function (a, s) { return a + s.tOut; }, 0);
  var tTrim = stats.reduce(function (a, s) { return a + s.tTrim; }, 0);
  var kpi = [
    ['Slitting jobs', jobs.length, totalCoils + ' slit coils out', 'purple'],
    ['Master tonnage in', tIn.toFixed(1) + ' t', jobs.length + ' coils', 'purple'],
    ['Slit output', tOut.toFixed(1) + ' t', 'strips shipped', 'green'],
    ['Side-trim scrap', tTrim.toFixed(2) + ' t', (100 - avgY).toFixed(1) + '% edge loss', 'amber'],
    ['Avg yield', avgY.toFixed(1) + '%', 'width = mass yield', 'green']
  ];
  document.getElementById('kpis').innerHTML = kpi.map(function (k) {
    return '<div class="kpi ' + k[3] + '"><div class="k">' + k[0] + '</div><div class="v">' + k[1] + '</div><div class="s">' + k[2] + '</div></div>';
  }).join('');

  // one cut-plan card per slitting job
  document.getElementById('cards').innerHTML = jobs.map(function (j) {
    var c = calc(j), master = c.master, pct = function (mm) { return (mm / master * 100).toFixed(3) + '%'; };
    var uniform = c.strips.every(function (s) { return s.w === c.strips[0].w; });
    var stripLabel = uniform ? (c.strips.length + ' × ' + c.strips[0].w + ' mm') : (c.strips.length + ' strips');
    var yCls = c.y >= 96 ? 'ok' : 'warn';

    var lay = '<div class="slit-seg trim" style="flex:0 0 ' + pct(c.edge) + '">trim<span class="sw">' + c.edge + '</span></div>';
    c.strips.forEach(function (s) { lay += '<div class="slit-seg strip" style="flex:0 0 ' + pct(s.w) + '">' + s.id + '<span class="sw">' + s.w + ' mm</span></div>'; });
    lay += '<div class="slit-seg trim" style="flex:0 0 ' + pct(c.edge) + '">trim<span class="sw">' + c.edge + '</span></div>';

    var maxW = Math.max.apply(null, c.strips.map(function (s) { return s.w; }));
    var stripBars = c.strips.map(function (s) {
      return '<div class="slit-bar-row"><span class="lbl">' + s.id + '</span><span class="track"><span class="fill" style="width:' + (s.w / maxW * 100) + '%"></span></span><span class="val">' + s.w + ' mm · <span class="t">' + s.t.toFixed(1) + ' t</span></span></div>';
    }).join('') + '<div class="slit-bar-row"><span class="lbl" style="color:#607d8b">Trim</span><span class="track"><span class="fill" style="width:' + (c.trim / maxW * 100) + '%;background:#cfd8dc"></span></span><span class="val">' + c.trim + ' mm · ' + c.tTrim.toFixed(2) + ' t</span></div>';

    var master_info = [['Order', j.order], ['Customer', j.customer], ['Master width', master + ' mm'], ['Thickness', j.crcThk.toFixed(2) + ' mm'], ['Coil weight', c.wt.toFixed(1) + ' t'], ['Coil length', Math.round(c.lengthM) + ' m'], ['Edge trim', c.edge + ' mm × 2'], ['Slit coils', stripLabel]]
      .map(function (x) { return '<div class="m-item"><span class="m-k">' + x[0] + '</span><span class="m-v">' + x[1] + '</span></div>'; }).join('');

    return '<div class="card">' +
      '<div class="card-head"><i class="fa-solid fa-ruler-combined"></i> <b>' + j.coil + '</b> <span class="chip">' + j.grade + '</span> <span class="chip"><i class="fa-solid fa-code-fork"></i> 1 master → ' + c.strips.length + ' coils</span>' +
        '<span class="right"><span class="yb ' + yCls + '"><i class="fa-solid fa-percent"></i> ' + c.y.toFixed(1) + '% yield</span> ' + j.sched + '</span></div>' +
      '<div class="card-body">' +
        '<div class="master-line">' + master_info + '</div>' +
        '<div class="slit-layout">' + lay + '</div>' +
        '<div class="slit-axis"><span>0</span><span class="a-mid">&#9664; master width ' + master + ' mm &#9654;</span><span>' + master + '</span></div>' +
        '<div class="slit-cols">' +
          '<div><div class="slit-sub">Slit strip widths</div>' + stripBars + '</div>' +
          '<div><div class="slit-sub">Material yield</div><div class="slit-yield">' +
            '<div class="big">' + c.y.toFixed(1) + '%</div>' +
            '<div style="font-size:11px;color:var(--color-text-hint)">width utilised (' + c.used + ' of ' + master + ' mm) → <b>' + c.tOut.toFixed(1) + ' t</b> of ' + c.wt.toFixed(1) + ' t</div>' +
            '<div class="y-bar"><div class="y-used" style="width:' + c.y + '%"></div><div class="y-trim" style="width:' + (100 - c.y) + '%"></div></div>' +
            '<div class="y-legend"><span><span class="y-sw" style="background:#66bb6a"></span>Strips ' + c.used + ' mm · ' + c.y.toFixed(1) + '% · ' + c.tOut.toFixed(1) + ' t</span>' +
            '<span><span class="y-sw" style="background:#cfd8dc"></span>Side-trim ' + c.trim + ' mm · ' + (100 - c.y).toFixed(1) + '% · ' + c.tTrim.toFixed(2) + ' t</span></div>' +
          '</div></div>' +
        '</div>' +
      '</div></div>';
  }).join('');
</script>
</body>
</html>
