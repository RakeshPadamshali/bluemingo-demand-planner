<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bright Bar · Vardhman Special Steels</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="vss-shell.css">
<style>
  .lines { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
  .lcard { border:1px solid var(--color-border); border-radius:8px; padding:10px 12px; background:#fff; }
  .lcard .lh { display:flex; align-items:center; gap:7px; font-weight:600; font-size:13px; margin-bottom:4px; }
  .lcard .lh i { color:var(--color-primary); }
  .lcard .lr { font-size:11px; color:var(--color-text-secondary); margin:2px 0; }
  .lcard .lr b { color:var(--color-text-primary); }
  .lcard .cap { font-size:16px; font-weight:700; }
  .lcard .rt { font-size:10.5px; color:var(--color-text-hint); margin-top:5px; border-top:1px dashed var(--color-border-light); padding-top:5px; }
</style>
<script src="vss-embed.js"></script>
</head>
<body>
<div class="bm-layout">
  <main class="bm-content">
    <div class="page-bar">
      <div><h1>Bright Bar Shop — Peeling &amp; Drawing</h1><div class="crumb">Production Plan › Bright Bar › <span id="ctx"></span></div></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="card"><div class="card-head"><i class="fa-solid fa-ruler-horizontal"></i> Finishing lines <span class="right" id="lmeta"></span></div><div class="card-body"><div class="lines" id="lines"></div></div></div>
    <div class="card">
      <div class="card-head"><i class="fa-solid fa-list-check"></i> Line schedule — sample orders <span class="right">urgent-stacking FIFO first, then normal FIFO</span></div>
      <div class="card-body"><table class="tbl" id="tbl"></table>
      <div class="note"><i class="fa-solid fa-circle-info"></i> ≥1-week sequence per line; rolled bars stacked <b>Urgent FIFO</b> before <b>Normal FIFO</b> for the Bright Bar shop.</div></div>
    </div>
  </main>
</div>
<script>window.VSS_PAGE='brightbar'; window.VSS_TITLE='Bright Bar'; window.VSS_ICON='fa-ruler-horizontal';</script>
<script src="vss-chrome.js"></script>
<script src="vss-data.js"></script>
<script src="vss-core.js"></script>
<script>
  var V=window.VSS, lines=V.bbsCfg.lines;
  document.getElementById('ctx').textContent = V.meta.plant + ' · ' + lines.length + ' lines';
  var peel=lines.filter(function(l){return /Peel/.test(l.machine);}).length, draw=lines.length-peel;
  var brightTons=Math.round(V.orders.reduce(function(a,o){return a+(/^[PD]/.test(o.supplyCond)?(o.qty||0):0);},0));
  [['Finishing lines',lines.length,'peeling + drawing','blue'],
   ['Total capacity',V.bbsCfg.totalCapMT+' MT','shop','blue'],
   ['Peeling lines',peel,'PL-1 … PL-5','accent'],
   ['Drawing line',draw,'16 h working','accent'],
   ['Bright-bar demand',brightTons+' MT','P* / D* orders','green'],
   ['Per-day cap',Math.round(lines.reduce(function(a,l){return a+(l.capDay||0);},0))+' MT','all lines','green']
  ].forEach(function(k){ document.getElementById('kpis').insertAdjacentHTML('beforeend','<div class="kpi '+k[3]+'"><div class="k">'+k[0]+'</div><div class="v">'+k[1]+'</div><div class="s">'+k[2]+'</div></div>'); });

  document.getElementById('lmeta').textContent = lines.length+' lines';
  document.getElementById('lines').innerHTML = lines.map(function(l){
    return '<div class="lcard"><div class="lh"><i class="fa-solid '+(/Draw/.test(l.machine)?'fa-arrows-left-right-to-line':'fa-ruler-horizontal')+'"></i>'+l.machine.replace(' @ 16 hours working.','')+'</div>'+
      '<div class="lr">Range <b>'+l.range+' mm</b></div>'+
      '<div class="lr">Conditions <b>'+(l.process||'—')+'</b></div>'+
      '<div class="lr"><span class="cap">'+(l.capDay!=null?Math.round(l.capDay):'—')+'</span> MT/day <span class="hint">· cap '+(l.capMT||'—')+' MT · change '+(l.changeover||'—')+' h</span></div>'+
      '<div class="rt">'+ (l.route||'') +'</div></div>';
  }).join('');

  var rows=V.bbsRows||[];
  var COLS=['Line','Zone','Customer','Sales order','Grade · Cat','In → Fin size','Supply','Ord qty','Fin qty','Stacking date','Stk qty'];
  document.getElementById('tbl').innerHTML='<thead><tr>'+COLS.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr></thead><tbody>'+
    (rows.length?rows.map(function(r){
      return '<tr><td class="strong">'+(r.line||'—').replace(' @ 16 hours working.','')+'</td>'+
        '<td><span class="chip">'+(r.zone||'—')+'</span></td>'+
        '<td>'+(r.cust||'—')+'</td>'+
        '<td class="mono">'+(r.so||'—')+'</td>'+
        '<td class="strong">'+(r.grade||'')+'<div class="hint" style="font-weight:400">'+(r.category||'')+'</div></td>'+
        '<td class="mono">'+(r.inSize||'—')+' → '+(r.finSize||'—')+'</td>'+
        '<td>'+(r.supplyCond||'—')+'</td>'+
        '<td class="mono right-al">'+(r.ordQty!=null?r.ordQty:'—')+'</td>'+
        '<td class="mono right-al strong">'+(r.finQty!=null?r.finQty.toFixed(1):'—')+'</td>'+
        '<td class="mono">'+(r.stkgDate||'—')+'</td>'+
        '<td class="mono right-al">'+(r.stkgQty!=null?r.stkgQty.toFixed(1):'—')+'</td></tr>';
    }).join(''):'<tr><td colspan="11" class="hint">No sample rows</td></tr>')+'</tbody>';
</script>
</body>
</html>
