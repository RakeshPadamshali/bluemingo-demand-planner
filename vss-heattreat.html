<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heat Treatment · Vardhman Special Steels</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="vss-shell.css">
<style>
  .furns { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }
  .furn { border:1px solid var(--color-border); border-radius:8px; padding:10px 12px; background:#fff; }
  .furn.alarm { border-color:#f0b4b4; background:#fff7f7; }
  .furn .fh { display:flex; align-items:center; gap:7px; font-weight:600; }
  .furn .fh i { color:#e34948; }
  .furn .fload { font-size:20px; font-weight:700; margin:4px 0 2px; }
  .furn .bar { height:12px; background:#eef1f4; border-radius:6px; overflow:hidden; margin:6px 0; } .furn .bar span{display:block;height:100%;border-radius:6px;}
  .furn .ft { font-size:11px; color:var(--color-text-secondary); }
</style>
<script src="vss-embed.js"></script>
</head>
<body>
<div class="bm-layout">
  <main class="bm-content">
    <div class="page-bar">
      <div><h1>Heat Treatment — Annealing</h1><div class="crumb">Production Plan › Heat Treatment › <span id="ctx"></span></div></div>
      <div class="actions"><a class="btn btn-outline" href="vss-gantt.html"><i class="fa-solid fa-chart-gantt"></i> Master Gantt</a></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="grid2">
      <div class="card"><div class="card-head"><i class="fa-solid fa-temperature-high"></i> Annealing types</div><div class="card-body"><table class="tbl" id="types"></table></div></div>
      <div class="card"><div class="card-head"><i class="fa-solid fa-fire"></i> Furnace loading <span class="right">6 × 18 MT · load &lt; 18 MT = capacity-loss alarm</span></div><div class="card-body"><div class="furns" id="furns"></div></div></div>
    </div>
    <div class="card">
      <div class="card-head"><i class="fa-solid fa-chart-gantt"></i> Furnace occupancy <span class="right" id="gmeta"></span></div>
      <div class="card-body"><div class="gantt" id="gantt"></div><div class="note"><i class="fa-solid fa-circle-info"></i> Long anneal cycles (Spherodized 85 h / Normal 40 h + 12 h cooling); a 36 MT order splits across 2 furnaces.</div></div>
    </div>
  </main>
</div>
<script>window.VSS_PAGE='heattreat'; window.VSS_TITLE='Heat Treatment'; window.VSS_ICON='fa-temperature-high';</script>
<script src="vss-chrome.js"></script>
<script src="vss-data.js"></script>
<script src="vss-core.js"></script>
<script>
  var V=window.VSS, HT=V.htCfg;
  document.getElementById('ctx').textContent = V.meta.plant + ' · ' + HT.furnaces + ' furnaces';
  var anneal=['RXA','PGS','PXS','PGA'];
  var annealTons=V.orders.reduce(function(a,o){return a+(anneal.indexOf(o.supplyCond)>=0?(o.qty||0):0);},0);

  // pack annealed tonnage into 18 MT charges
  var nCh=Math.max(HT.furnaces, Math.ceil(annealTons/HT.furnaceMT)), rem=annealTons, charges=[];
  for(var i=0;i<nCh;i++){ var mt=Math.max(0,Math.min(HT.furnaceMT, rem)); rem-=mt; charges.push({mt:mt, type:HT.types[i%HT.types.length]}); }
  // per-furnace: first assigned charge is "current", rest queued
  var perF=[]; for(var f=0;f<HT.furnaces;f++){ var mine=charges.filter(function(c,ci){return ci%HT.furnaces===f;}); perF.push(mine); }
  var alarms=charges.filter(function(c){return c.mt>0 && c.mt<HT.furnaceMT;}).length;

  [['Furnaces',HT.furnaces,'× '+HT.furnaceMT+' MT','blue'],
   ['Anneal demand',Math.round(annealTons)+' MT','RXA/PGS/PXS/PGA','blue'],
   ['Charges',charges.filter(function(c){return c.mt>0;}).length,'18 MT batches','accent'],
   ['Under-load alarms',alarms,'< 18 MT charge','red'],
   ['Spherodized',HT.types.filter(function(t){return /Spher/.test(t.type);}).length,'85 h cycle','amber'],
   ['Normal anneal',HT.types.filter(function(t){return /Normal/.test(t.type);}).length,'40 h cycle','amber']
  ].forEach(function(k){ document.getElementById('kpis').insertAdjacentHTML('beforeend','<div class="kpi '+k[3]+'"><div class="k">'+k[0]+'</div><div class="v">'+k[1]+'</div><div class="s">'+k[2]+'</div></div>'); });

  document.getElementById('types').innerHTML='<thead><tr><th>Supply cond</th><th>Type</th><th>Cycle</th><th>Cooling/change</th></tr></thead><tbody>'+
    HT.types.map(function(t){return '<tr><td class="mono strong">'+t.cond+'</td><td>'+t.type+'</td><td class="mono right-al">'+(t.cycleHr||'—')+' h</td><td class="mono right-al">'+(t.coolHr||'—')+' h</td></tr>';}).join('')+'</tbody>';

  document.getElementById('furns').innerHTML=perF.map(function(mine,f){
    var cur=mine[0]||{mt:0,type:HT.types[0]}; var pc=Math.round(cur.mt/HT.furnaceMT*100);
    var under=cur.mt>0 && cur.mt<HT.furnaceMT;
    return '<div class="furn'+(under?' alarm':'')+'"><div class="fh"><i class="fa-solid fa-fire"></i> Furnace F'+(f+1)+'</div>'+
      '<div class="fload">'+cur.mt.toFixed(1)+' <span class="hint" style="font-size:12px">/ '+HT.furnaceMT+' MT</span></div>'+
      '<div class="bar"><span style="width:'+pc+'%;background:'+(under?'#e34948':'#2e7d32')+'"></span></div>'+
      '<div class="ft">'+(cur.type?cur.type.type+' · '+cur.type.cycleHr+' h':'—')+'</div>'+
      '<div class="ft" style="margin-top:3px">'+(under?'<span class="badge b-red"><i class="fa-solid fa-triangle-exclamation"></i> capacity loss</span>':'<span class="badge b-green">full charge</span>')+' <span class="hint">'+mine.length+' in queue</span></div>'+
      '</div>';
  }).join('');

  // furnace gantt (furnace lanes from vssSchedule)
  var sch=vssSchedule();
  var fUnits=sch.units.filter(function(u){return /Furnace/.test(u);});
  var fBars=sch.bars.filter(function(b){return /Furnace/.test(b.unit);});
  var startMin=Math.max(0,Math.min.apply(null,fBars.map(function(b){return b.start;}))-120);
  vssRenderGantt(document.getElementById('gantt'), fUnits, fBars, {laneTitle:'Furnace', startMin:startMin, laneW:120, batchTag:'BATCH'});
  document.getElementById('gmeta').textContent=fBars.length+' charges scheduled';
</script>
</body>
</html>
