<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casting · SMS · Vardhman Special Steels</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="vss-shell.css">
<style>
  .cfg { display:flex; gap:16px; flex-wrap:wrap; } .cfg .mini { min-width:96px; }
  .moqgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; }
  .moqcell { border:1px solid var(--color-border); border-radius:6px; padding:6px 9px; text-align:center; } .moqcell .c { font-weight:700; font-size:14px; } .moqcell .m { font-size:10px; color:var(--color-text-muted); text-transform:uppercase; }
  .load-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:12px; } .load-row .ln{width:180px;} .load-row .lt{flex:1;height:12px;background:#eef1f4;border-radius:6px;overflow:hidden;} .load-row .lf{display:block;height:100%;border-radius:6px;} .load-row .lv{width:90px;text-align:right;font-variant-numeric:tabular-nums;}
</style>
<script src="vss-embed.js"></script>
</head>
<body>
<div class="bm-layout">
  <main class="bm-content">
    <div class="page-bar">
      <div><h1>Casting — Steel Melt Shop (SMS)</h1><div class="crumb">Production Plan › Casting · SMS › <span id="ctx"></span></div></div>
      <div class="actions"><a class="btn btn-outline" href="vss-rolling.html"><i class="fa-solid fa-bars-staggered"></i> Rolling</a></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="grid2">
      <div class="card"><div class="card-head"><i class="fa-solid fa-industry"></i> Caster sections &amp; capacity</div><div class="card-body"><div class="cfg" id="sections"></div><div class="note"><i class="fa-solid fa-circle-info"></i> Target sequence <b>1+1</b> · section change 1 h · min order qty clubbed per heat = MOQ by supply condition.</div></div></div>
      <div class="card"><div class="card-head"><i class="fa-solid fa-boxes-stacked"></i> Billet stock — open stock first</div><div class="card-body" id="billet"></div></div>
    </div>
    <div class="card"><div class="card-head"><i class="fa-solid fa-scale-balanced"></i> MOQ per supply condition (MT/heat)</div><div class="card-body"><div class="moqgrid" id="moq"></div></div></div>
    <div class="card">
      <div class="card-head"><i class="fa-solid fa-fire-flame-curved"></i> Casting plan — heats <span class="right" id="hmeta"></span></div>
      <div class="card-body"><table class="tbl" id="tbl"></table></div>
    </div>
  </main>
</div>
<script>window.VSS_PAGE='casting'; window.VSS_TITLE='Casting · SMS'; window.VSS_ICON='fa-fire-flame-curved';</script>
<script src="vss-chrome.js"></script>
<script src="vss-data.js"></script>
<script src="vss-core.js"></script>
<script>
  var V=window.VSS, heats=vssMOQGap(), b=vssBilletBuckets(), PL=vssPlan(), INV=vssInventory();
  document.getElementById('ctx').textContent = V.meta.plant + ' · ' + V.smsCfg.sections.length + ' sections';
  var gaps=heats.filter(function(h){return h.gap>0;}).length;
  var toCast=Math.round(PL.load['Caster (SMS)']?PL.load['Caster (SMS)'].mt:0);   // billet MT the plan casts (full need for no-stock orders + top-ups)
  [['Heats planned',heats.length,'sample window','blue'],
   ['Heat size',V.smsCfg.heatMT+' MT','× '+V.smsCfg.capHeatsDay+'/day','blue'],
   ['Sections',V.smsCfg.sections.length,'160/200/210','accent'],
   ['MOQ gaps',gaps,'below min-order','amber'],
   ['To cast',toCast+' MT','billet MT after open stock · incl. '+INV.topUp.mt+' MT top-up','green'],
   ['Billet allocated',b.allocated+' MT','to orders','green']
  ].forEach(function(k){ document.getElementById('kpis').insertAdjacentHTML('beforeend','<div class="kpi '+k[3]+'"><div class="k">'+k[0]+'</div><div class="v">'+k[1]+'</div><div class="s">'+k[2]+'</div></div>'); });

  document.getElementById('sections').innerHTML = V.smsCfg.sections.map(function(s){
    return '<div class="mini"><span class="mk">'+s.section+'</span><span class="mv">'+s.heatMT+' MT · '+s.capHeatsDay+'/day</span><span class="hint" style="font-size:10px">change '+s.changeHr+' h</span></div>';
  }).join('');

  var tb=b.allocated+b.unallocated+b.notOkay||1;
  document.getElementById('billet').innerHTML =
    [['Allocated to orders',b.allocated,'#2e7d32'],['Un-allocated (sampling)',b.unallocated,'#f0a020'],['Not-Okay (off quality)',b.notOkay,'#d84a4a']].map(function(x){
      var pc=Math.round(x[1]/tb*100);
      return '<div class="load-row"><span class="ln">'+x[0]+'</span><span class="lt"><span class="lf" style="width:'+pc+'%;background:'+x[2]+'"></span></span><span class="lv">'+x[1]+' MT</span></div>';
    }).join('') + '<div class="note"><i class="fa-solid fa-circle-info"></i><span>Allocated stock is drawn at the mill order by order ('+INV.fullCover+' orders fully covered, '+INV.topUp.n+' need a top-up cast) — <a href="vss-inventory.html">Inventory Consumption</a> shows the run-down.</span></div>';

  document.getElementById('moq').innerHTML = Object.keys(V.smsCfg.moq).map(function(k){
    return '<div class="moqcell"><div class="c">'+V.smsCfg.moq[k]+'</div><div class="m">'+k+'</div></div>';
  }).join('');

  var COLS=['Heat','Zone','Customer','Sales order','Grade · Cat','Supply','Section','IH qty','MOQ','Cast date','Prod order','Status'];
  document.getElementById('hmeta').textContent = heats.length+' heats · target seq 1+1';
  document.getElementById('tbl').innerHTML = '<thead><tr>'+COLS.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr></thead><tbody>'+
    heats.map(function(h,i){
      return '<tr><td class="mono strong">'+(h.heatSrl||(i+1))+'</td>'+
        '<td><span class="chip">'+(h.zone||'—')+'</span></td>'+
        '<td>'+(h.cust||'—')+'</td>'+
        '<td class="mono">'+(h.so||'—')+'</td>'+
        '<td class="strong">'+(h.grade||'')+'<div class="hint" style="font-weight:400">'+(h.category||'')+'</div></td>'+
        '<td>'+(h.supplyCond||'—')+'</td>'+
        '<td class="mono">'+(h.billetSize||'—')+'</td>'+
        '<td class="mono right-al">'+(h.ihQty!=null?h.ihQty:'—')+'</td>'+
        '<td class="mono right-al">'+(h.moq||'—')+'</td>'+
        '<td class="mono">'+(h.castDate||'—')+'</td>'+
        '<td class="mono">'+(h.prodOrder||'—')+'</td>'+
        '<td>'+(h.moqOk?'<span class="badge b-green">MOQ ok</span>':'<span class="badge b-amber">gap '+h.gap.toFixed(0)+' MT</span>')+'</td>'+
        '</tr>';
    }).join('')+'</tbody>';
</script>
</body>
</html>
